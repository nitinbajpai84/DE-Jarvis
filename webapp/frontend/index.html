  return `
    <div class="panel"><div class="panel-head"><h3>All open questions</h3><span class="note">${(r.open_questions||[]).length} · generated from findings, phrased as questions — never conclusions</span></div>
      ${allQ || '<div class="empty-note">None.</div>'}</div>

    <div class="panel"><div class="panel-head"><h3>References</h3>
        <span class="note">direction from the model · integrity from the data · ${rel.orphans.length + rel.weak.length} with orphans</span></div>
      ${refRows ? `<div class="est-table-wrap"><table class="est-table"><thead><tr><th>From</th><th>To</th><th class="num">Resolves</th><th>Integrity</th></tr></thead><tbody>${refRows}</tbody></table></div>`
               : '<div class="empty-note">No references found (tier 3 not run, or no id-like columns shared).</div>'}</div>

    <div class="e-grid">
      <div class="panel" style="margin-bottom:18px;"><div class="panel-head"><h3>Sensitive data</h3>
          <span class="note">candidate classification by column name — confirm before relying on it</span></div>
        ${sens ? `<div style="margin-bottom:10px;">${sens}</div><div class="est-table-wrap"><table class="est-table"><thead><tr><th>Column</th><th>Class</th></tr></thead><tbody>${sensRows}</tbody></table></div>`
               : '<div class="empty-note">No personal-data column names found.</div>'}</div>
      <div class="panel" style="margin-bottom:18px;"><div class="panel-head"><h3>Quality hotspots</h3>
          <span class="note">≥ ${r.quality.threshold_pct}% null · ${expected} expected-by-design excluded</span></div>
        ${hot ? `<div class="est-table-wrap"><table class="est-table"><thead><tr><th>Column</th><th class="num">Null</th></tr></thead><tbody>${hot}</tbody></table></div>`
              : `<div class="empty-note">No unexpected null-heavy columns in the profiled tables.</div>`}</div>
    </div>

    <div class="panel"><div class="panel-head"><h3>Mirrored tables</h3>
        <span class="note">same name, columns and rows in two schemas — compared on business columns, build metadata excluded</span></div>
      ${mirrorRows ? `<div class="est-table-wrap"><table class="est-table"><thead><tr><th>Copy</th><th>Mirrors</th><th class="num">Size</th><th>Content</th></tr></thead><tbody>${mirrorRows}</tbody></table></div>`
                   : '<div class="empty-note">No mirrored tables.</div>'}</div>

    <div class="panel"><div class="panel-head"><h3>Readiness against intent</h3>
        <span class="note">every required data point, matched to the estate by exact column name</span></div>
      ${readiness || `<div class="empty-note">No intent captured for ${esc(currentDomain)} yet — capture one in Catalogue &amp; intent, then re-run the report.</div>`}</div>

    <div class="panel"><div class="panel-head"><h3>What each table appears to be</h3>
        <span class="note">The Data Detective's reading · suggestions, not facts · measured findings are shown above, never restated here</span></div>
      ${entities || '<div class="empty-note">Tier 4 not run on this scan.</div>'}</div>`;
}

async function loadEstate(){
  const statusEl = document.getElementById('scanStatus');
  if (!statusEl) return;
  try {
    const [sr, rr] = await Promise.all([
      api(`/api/estate/scans?domain=${encodeURIComponent(currentDomain)}&target=${encodeURIComponent(currentTarget)}`),
      api(`/api/estate/report?domain=${encodeURIComponent(currentDomain)}&target=${encodeURIComponent(currentTarget)}`),
    ]);
    const s = await sr.json(), r = await rr.json();
    if (!sr.ok) throw new Error(s.detail || sr.statusText);
    if (!rr.ok) throw new Error(r.detail || rr.statusText);
    statusEl.innerHTML = scanStatusHtml(s.scans, s.running);
    const btn = document.getElementById('scanBtn');
    if (btn) { btn.disabled = !!s.running; btn.textContent = s.running ? 'Scanning…' : 'Run scan'; }
    const ov = document.getElementById('estateOverview');
    if (ov) ov.innerHTML = estateOverviewHtml(r);
    const fin = document.getElementById('estateFindings');
    if (fin) fin.innerHTML = estateFindingsHtml(r);
    if (s.running) scheduleEstatePoll();
  } catch (e) {
    statusEl.innerHTML = `<span class="sev high">error</span> <span>Could not load the estate: ${esc(e.message)}</span>`;
  }
}
window.loadEstate = loadEstate;

function scheduleEstatePoll(){
  clearTimeout(estatePollTimer);
  estatePollTimer = setTimeout(() => {
    // Stop polling the moment the user leaves Discovery -- the scan keeps running server-side
    // regardless, and its row is picked up next time the screen opens.
    if (!document.getElementById('scanStatus')) return;
    loadEstate();
  }, 3000);
}

async function startEstateScan(){
  const tiers = document.getElementById('scanTiers').value;
  const fd = new FormData();
  fd.append('domain', currentDomain); fd.append('target', currentTarget); fd.append('tiers', tiers);
  const btn = document.getElementById('scanBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  try {
    const r = await api('/api/estate/scan', {method:'POST', body: fd});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    await loadEstate();
    scheduleEstatePoll();
  } catch (e) {
    document.getElementById('scanStatus').innerHTML = `<span class="sev high">error</span> <span>${esc(e.message)}</span>`;
    if (btn) { btn.disabled = false; btn.textContent = 'Run scan'; }
  }
}
window.startEstateScan = startEstateScan;

/* ============================== source review loop (step 01) ============================== */
function statusChip(st, pendingLabel){
  if (!st) return '';
  return `<span class="rv-status ${esc(st)}">${esc(st === 'pending' ? (pendingLabel || 'awaiting review') : st)}</span>`;
}

function diffLine(tag, cls, html){
  return `<div class="rv-change"><span class="tag ${cls}">${tag}</span><span>${html}</span></div>`;
}

function sourceDiffHtml(d, comparedWith){
  if (!d || d.first_version) return `<div class="rv-note">First version of this source — nothing on record to compare it with.</div>`;
  if (d.unchanged) return `<div class="rv-note">Same columns, types, keys and row count as v${comparedWith}.</div>`;
  const out = [];
  if (d.rows.before !== d.rows.after) out.push(diffLine('rows', 'mod', `${fmtNum(d.rows.before)} → ${fmtNum(d.rows.after)}`));
  d.columns_added.forEach(c => out.push(diffLine('added', 'add', `<code>${esc(c)}</code>`)));
  d.columns_removed.forEach(c => out.push(diffLine('removed', 'del', `<code>${esc(c)}</code>`)));
  d.type_changes.forEach(t => out.push(diffLine('type', 'mod', `<code>${esc(t.column)}</code> ${esc(t.before)} → ${esc(t.after)}`)));
  d.null_shifts.forEach(t => out.push(diffLine('empty values', 'mod', `<code>${esc(t.column)}</code> ${t.before}% → ${t.after}%`)));
  d.keys_gained.forEach(c => out.push(diffLine('unique', 'add', `<code>${esc(c)}</code> is now unique in the sample`)));
  d.keys_lost.forEach(c => out.push(diffLine('not unique', 'del', `<code>${esc(c)}</code> is no longer unique in the sample`)));
  (d.fields_added || []).forEach(c => out.push(diffLine('field', 'add', `<code>${esc(c)}</code> now extracted`)));
  (d.fields_removed || []).forEach(c => out.push(diffLine('field', 'del', `<code>${esc(c)}</code> no longer found`)));
  if (d.connection_changed) out.push(diffLine('location', 'mod', 'read from a different file or connection'));
  return out.join('');
}

function sourceImpactHtml(im){
  if (!im) return '';
  if (!im.intent_captured) return `<div class="rv-note">No intent captured yet, so there's nothing for this version to satisfy or break.</div>`;
  if (!im.newly_resolved.length && !im.newly_open.length) return `<div class="rv-note">Doesn't change whether any intent's data points are found.</div>`;
  return im.newly_resolved.map(g => diffLine('now found', 'add', `<code>${esc(g.data_point)}</code> — ${esc(g.intent)} · ${esc(g.report)}`)).join('')
       + im.newly_open.map(g => diffLine('now missing', 'del', `<code>${esc(g.data_point)}</code> — ${esc(g.intent)} · ${esc(g.report)}`)).join('');
}

function previewTableHtml(p){
  const pv = p.preview;
  if (!pv || !pv.rows) return `<div class="rv-note">No row preview — this version was profiled before previews were kept. Re-profile it to capture one.</div>`;
  if (!pv.rows.length) return `<div class="rv-note">The source had no rows.</div>`;
  const head = pv.header.map(h => `<th scope="col">${esc(h)}</th>`).join('');
  const body = pv.rows.map(r => `<tr>${pv.header.map((_, i) => {
    const v = r[i];
    return (v === null || v === undefined || v === '') ? '<td class="null">empty</td>' : `<td>${esc(v)}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="rv-preview"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="intent-help" style="margin-top:6px;">First ${pv.rows.length} of ${fmtNum(p.sampled_rows)} sampled rows, exactly as read</div>`;
}

function renderReview(v){
  const panel = document.getElementById('reviewPanel');
  if (!panel) return;
  const hist = v.history || [];
  const m = v.meta || {};
  const liveV = [...hist].reverse().find(h => (h.review || {}).status !== 'rejected');
  const liveVersion = liveV ? liveV.version : null;
  const sid = v.source_id;
  const histHtml = [...hist].reverse().map(h => {
    const rv = h.review || {};
    return `<button class="${h.version === m.version ? 'on' : ''}" onclick="openReview('${esc(sid)}', ${h.version})">
      <span class="h1">v${h.version}${h.version === liveVersion ? ' <span class="rv-ver">live</span>' : ''} ${statusChip(rv.status)}</span>
      <span class="h2">${esc(h.reason || '')} · ${esc(h.created_by || '')} · ${timeAgo(h.created_at)}${h.file ? `<br>${esc(h.file.name)}${h.file.note ? ' — “' + esc(h.file.note) + '”' : ''}` : ''}</span>
    </button>`;
  }).join('') || `<div class="rv-note">No version history — profiled before versioning. Re-profile or upload to start one.</div>`;

  const rv = m.review || {};
  let decide = '';
  if (m.version && rv.status === 'pending') {
    decide = `<div class="rv-decide">
      <input id="rvComment" placeholder="Comment — required to reject" aria-label="Review comment">
      <button class="btn primary" onclick="decideReview('${esc(sid)}', ${m.version}, 'accept')">Accept v${m.version}</button>
      <button class="btn reject" onclick="decideReview('${esc(sid)}', ${m.version}, 'reject')">Reject</button>
    </div>`;
  } else if (m.version && rv.status) {
    decide = `<div class="rv-decide"><span class="rv-signed">${esc(rv.status === 'accepted' ? 'Accepted' : 'Rejected')} by ${esc(rv.by || '')} · ${timeAgo(rv.at)}${rv.comment ? ' — “' + esc(rv.comment) + '”' : ''}</span>
      ${rv.status === 'accepted' ? `<input id="rvComment" placeholder="Why withdraw it?" aria-label="Withdrawal reason">
      <button class="btn reject" onclick="decideReview('${esc(sid)}', ${m.version}, 'reject')">Withdraw</button>` : ''}</div>`;
  }

  const p = v.profile || {};
  const canReprofile = p.connection && !(p.connection.path || '').startsWith('landing/uploads/');
  panel.hidden = false;
  panel.innerHTML = `
    <div class="rv-head">
      <h3>Review ${esc(sid)}</h3>
      ${m.version ? `<span class="rv-ver">v${m.version}${v.compared_with ? ' · compared with v' + v.compared_with : ''}</span>` : ''}
      ${statusChip(rv.status)}
      <span class="rv-actions">
        <button class="btn ghost sm" onclick="reuploadSource('${esc(sid)}')">Upload a new file</button>
        ${canReprofile ? `<button class="btn ghost sm" onclick="reprofileSource('${esc(sid)}')">Re-profile</button>` : ''}
        <button class="btn ghost sm" onclick="closeReview()">Close</button>
      </span>
    </div>
    <div class="rv-grid">
      <div><div class="rv-sec"><h4>Versions</h4><div class="rv-hist">${histHtml}</div></div></div>
      <div>
        <div class="rv-sec"><h4>What changed</h4>${sourceDiffHtml(v.diff, v.compared_with)}</div>
        <div class="rv-sec"><h4>Effect on intent</h4>${sourceImpactHtml(v.impact)}</div>
        <div class="rv-sec"><h4>Preview</h4>${previewTableHtml(p)}</div>
        <div class="rv-sec"><h4>Profile</h4>${profileCard(p, {bare: true})}</div>
        ${decide}
        <div id="rvResult"></div>
      </div>
    </div>`;
}

async function openReview(sourceId, version){
  const panel = document.getElementById('reviewPanel');
  if (!panel) return;
  panel.hidden = false;
  if (!panel.innerHTML.trim()) panel.innerHTML = `<div class="empty-note">Loading ${esc(sourceId)}…</div>`;
  try {
    const q = `domain=${encodeURIComponent(currentDomain)}&source_id=${encodeURIComponent(sourceId)}` + (version ? `&version=${version}` : '');
    const r = await api(`/api/discovery/version?${q}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    renderReview(j);
    panel.scrollIntoView({behavior: 'smooth', block: 'start'});
  } catch (e) {
    panel.innerHTML = `<div class="conn-result bad">Could not open ${esc(sourceId)}: ${esc(e.message)}</div>`;
  }
}
window.openReview = openReview;

function closeReview(){
  const panel = document.getElementById('reviewPanel');
  if (panel) { panel.hidden = true; panel.innerHTML = ''; }
}
window.closeReview = closeReview;

async function decideReview(sourceId, version, decision){
  const out = document.getElementById('rvResult');
  const comment = (document.getElementById('rvComment') || {}).value || '';
  const fd = new FormData();
  fd.append('domain', currentDomain); fd.append('source_id', sourceId);
  fd.append('version', version); fd.append('decision', decision); fd.append('comment', comment);
  try {
    const r = await api('/api/discovery/review', {method: 'POST', body: fd});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    await loadProfiles();
    await refreshJourneyDataQuietly();
    await openReview(sourceId, version);
    const after = document.getElementById('rvResult');
    if (after) after.innerHTML = `<div class="conn-result ok">✓ v${version} ${esc(j.status)}${j.live_version ? ` — v${j.live_version} is live` : ' — no live version remains, so gap analysis no longer counts this source'}</div>`;
  } catch (e) {
    if (out) out.innerHTML = `<div class="conn-result bad">✕ ${esc(e.message)}</div>`;
  }
}
window.decideReview = decideReview;

async function reprofileSource(sourceId){
  const out = document.getElementById('rvResult');
  if (out) out.innerHTML = `<div class="conn-result">Re-reading ${esc(sourceId)}…</div>`;
  const fd = new FormData();
  fd.append('domain', currentDomain); fd.append('source_id', sourceId);
  try {
    const r = await api('/api/discovery/reprofile', {method: 'POST', body: fd});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    renderReview(j);
    await loadProfiles();
    await refreshJourneyDataQuietly();
  } catch (e) {
    const o = document.getElementById('rvResult');
    if (o) o.innerHTML = `<div class="conn-result bad">✕ ${esc(e.message)}</div>`;
  }
}
window.reprofileSource = reprofileSource;

function reuploadSource(sourceId){
  const input = document.getElementById('upSourceId');
  if (!input) return;
  input.value = sourceId;
  document.getElementById('uploadPanel').scrollIntoView({behavior: 'smooth', block: 'start'});

window.reuploadSource = reuploadSource;

async function uploadSourceFile(){
  const out = document.getElementById('upResult');
  const sourceId = document.getElementById('upSourceId').value.trim();
  const file = document.getElementById('upFile').files[0];
  if (!sourceId) { out.innerHTML = `<div class="conn-result bad">Give the source an id first — reuse an existing id to add a new version.</div>`; return; }
  if (!file) { out.innerHTML = `<div class="conn-result bad">Choose a file to upload.</div>`; return; }
  const fd = new FormData();
  fd.append('domain', currentDomain); fd.append('source_id', sourceId);
  fd.append('note', document.getElementById('upNote').value); fd.append('file', file);
  const btn = document.getElementById('upBtn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  out.innerHTML = `<div class="conn-result">Profiling ${esc(file.name)}…</div>`;
  try {
    const r = await api('/api/discovery/upload', {method: 'POST', body: fd});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    out.innerHTML = `<div class="conn-result ok">✓ ${esc(sourceId)} v${j.meta.version} uploaded — review it below.</div>`;
    document.getElementById('upFile').value = '';
    document.getElementById('upNote').value = '';
    await loadProfiles();
    await refreshJourneyDataQuietly();
    renderReview(j);
    document.getElementById('reviewPanel').scrollIntoView({behavior: 'smooth', block: 'start'});
  } catch (e) {
    out.innerHTML = `<div class="conn-result bad">✕ ${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Upload and profile';
  }
}
window.uploadSourceFile = uploadSourceFile;

function profileCard(p, opts){
  const rows = (p.columns || []).map(c => `<tr>
    <td class="cname">${esc(c.name)}${c.is_candidate_key ? '<span class="key">key</span>' : ''}</td>
    <td class="ctype">${esc(c.inferred_type)}</td>
    <td>${c.null_pct}%</td>
    <td>${fmtNum(c.distinct_count)}</td>
    <td class="samples">${(c.sample_values||[]).slice(0,3).map(esc).join(', ')}</td>
  </tr>`).join('');

  // Unstructured sources also carry real document content extraction (a Gemini read of each
  // sampled file) -- a summary plus every candidate field it found, not just file metadata.
  const extraction = (p.content_extraction || []).map(e => {
    const name = (e.file_path || '').split(/[\\/]/).pop();
    if (e.extraction_error) {
      return `<div class="extract-card"><div class="extract-file">${esc(name)}</div>
        <div class="extract-err">Content extraction unavailable: ${esc(e.extraction_error)}</div></div>`;
    }
    const fields = Object.entries(e.candidate_fields || {}).map(([k, v]) =>
      `<div class="extract-field"><span class="k">${esc(k)}</span><span class="v">${esc(typeof v === 'string' ? v : JSON.stringify(v))}</span></div>`
    ).join('');
    return `<div class="extract-card">
      <div class="extract-file">${esc(name)}</div>
      <div class="extract-summary">${esc(e.summary || '')}</div>
      <div class="extract-fields">${fields || '<span class="empty-note" style="padding:0;">No structured fields found</span>'}</div>
    </div>`;
  }).join('');

  const rvs = p.review || {};
  const bare = opts && opts.bare;
  return `<div class="profile-card">
    <div class="profile-top">
      ${bare ? '' : `<span class="pname">${esc(p.source_id)}</span>`}
      <span class="ptype">${esc((p.connection || {}).type || '')}</span>
      ${!bare && rvs.version ? `<span class="rv-ver">v${rvs.version}</span> ${statusChip(rvs.review_status)}` : ''}
      <span class="prows">${fmtNum(p.sampled_rows)}/${fmtNum(p.total_rows)} rows · profiled ${timeAgo(p.profiled_at)}</span>
      ${bare ? '' : `<span class="rv-actions">
        ${rvs.pending && rvs.review_status !== 'pending' ? `<span class="rv-ver">${rvs.pending} older pending</span>` : ''}
        <button class="btn ${rvs.review_status === 'pending' ? 'primary' : 'ghost'} sm" onclick="openReview('${esc(p.source_id)}')">${rvs.review_status === 'pending' ? 'Review' : 'Open'}</button>
      </span>`}
    </div>
    ${p.records_path ? `<div class="intent-help" style="margin-top:6px;">records read from <span class="mono">${esc(p.records_path)}</span> in the API response</div>` : ''}
    <table class="coltable"><thead><tr><th>Column</th><th>Type</th><th>Null%</th><th>Distinct</th><th>Samples</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${extraction ? `<div class="extract-wrap">${extraction}</div>` : ''}
  </div>`;
}

async function loadProfiles(){
  const host = document.getElementById('profileList');

      : `<div class="empty-note">Nothing profiled yet for this domain.</div>`;

    host.innerHTML = `<div class="empty-note">Could not load profiles: ${esc(e.message)}</div>`;

/* ============================== flow ============================== */
const LAYER_META = {bronze:{label:"Bronze",color:"var(--bronze)"},silver:{label:"Silver",color:"var(--silver)"},gold:{label:"Gold",color:"var(--gold)"}};
const STATUS_LABEL = {failed:["attention","Attention"], active:["healthy","Healthy"], pending:["empty","No runs yet"]};
function arrowSvg(){ return `<svg viewBox="0 0 34 18"><line x1="0" y1="9" x2="26" y2="9" stroke="var(--border)" stroke-width="2"/><path d="M22 4 L30 9 L22 14" stroke="var(--border)" stroke-width="2" fill="none"/></svg>`; }

async function refreshFlow(){
  const host = document.getElementById('flow'); if (!host) return;
  try {
    const r = await api(`/api/pipeline/flow?target=${encodeURIComponent(currentTarget)}&domain=${encodeURIComponent(currentDomain)}`);
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const j = await r.json();
    let html = "";
    ["bronze","silver","gold"].forEach((phase, i) => {
      const L = j.layers[phase], meta = LAYER_META[phase];
      const [cls,label] = STATUS_LABEL[L.status] || ["empty","Unknown"];
      html += `<div class="layer-card" style="--layer-color:${meta.color}">
        <div class="layer-top"><span class="layer-name">${meta.label}</span><span class="layer-status ${cls}">${label}</span></div>
        <div class="layer-stats">
          <div class="stat2"><b>${fmtNum(L.table_count)}</b><span>tables</span></div>
          <div class="stat2"><b>${fmtNum(L.columns)}</b><span>columns</span></div>
          <div class="stat2"><b>${fmtNum(L.rows)}</b><span>rows</span></div>
        </div>
        <div class="layer-tables">${
          (L.tables.slice(0,4).map(t=>`<span class="tchip">${esc(t)}</span>`).join('')) +
          (L.tables.length>4 ? `<span class="tchip">+${L.tables.length-4} more</span>` : "") +
          (L.failed_tables.map(f=>`<span class="tchip err">✕ ${esc(f.source_id)}</span>`).join(''))
        }</div>
        <div class="layer-sub">last run: ${timeAgo(L.last_run_at)}</div>
      </div>`;
      if (i < 2) html += `<div class="arrow">${arrowSvg()}</div>`;
    });
    host.innerHTML = html;
  } catch (e) {
    host.innerHTML = `<div class="empty-note">Could not load pipeline status: ${esc(e.message)}</div>`;
  }
}

async function refreshAlerts(){
  const feed = document.getElementById('alertFeed'); if (!feed) return;
  try {
    const r = await api(`/api/alerts?target=${encodeURIComponent(currentTarget)}&domain=${encodeURIComponent(currentDomain)}`);
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const j = await r.json();
    const digest = j.latest_digest;
    let html = "";
    if (digest && digest.date) {
      const parts = ["bronze","silver","gold"].map(p => `${digest.phases[p].tables} ${p}`).join(' · ');
      html += `<div class="alert-item"><div class="alert-dot ok"></div><div class="alert-body">
        <div class="t">Daily digest — ${esc(parts)}</div><div class="s">${esc(digest.date)} · ${esc(digest.target)}</div></div></div>`;
    }

        <div class="s">${timeAgo(f.ended_at)}</div></div></div>`;
    });
    feed.innerHTML = html;
  } catch (e) {
    feed.innerHTML = `<div class="empty-note">Could not load alerts: ${esc(e.message)}</div>`;
  }
}

const TICKET_STATUS_LABEL = {
  open: 'Open', assigned: 'Assigned', fix_pending_approval: 'Fix pending approval',
  resolved: 'Resolved', rejected: 'Rejected',
};

function renderTicketCard(t){
  const statusCls = esc(t.status);
  const statusLabel = TICKET_STATUS_LABEL[t.status] || t.status;
  let actions = '';
  if (t.status === 'open') {
    actions = `<input type="text" id="assignInput-${t.ticket_id}" placeholder="assign to (e.g. de-bronze)" value="de-bronze">
      <button class="btn ghost" onclick="ticketAssign(${t.ticket_id})">Assign to Data Engineer</button>
      <input type="text" id="rejectInput-${t.ticket_id}" placeholder="reason">
      <button class="btn ghost" onclick="ticketReject(${t.ticket_id})">Reject</button>`;
  } else if (t.status === 'assigned') {
    actions = `<input type="text" id="fixInput-${t.ticket_id}" placeholder="describe the fix applied">
      <button class="btn primary" onclick="ticketProposeFix(${t.ticket_id})">Propose fix</button>
      <input type="text" id="rejectInput-${t.ticket_id}" placeholder="reason">
      <button class="btn ghost" onclick="ticketReject(${t.ticket_id})">Reject</button>`;
  } else if (t.status === 'fix_pending_approval') {
    actions = `<span class="note">Awaiting G5 sign-off — start an Ops agent run to reach the gate.</span>
      <input type="text" id="rejectInput-${t.ticket_id}" placeholder="reason">
      <button class="btn ghost" onclick="ticketReject(${t.ticket_id})">Reject</button>`;
  }
  const note = t.resolution_note ? `<div class="ticket-meta">note: ${esc(t.resolution_note)}</div>` : '';
  const resolvedBy = t.resolved_by ? `<div class="ticket-meta">by ${esc(t.resolved_by)} · ${timeAgo(t.resolved_at)}</div>` : '';
  return `<div class="ticket-card">
    <div class="ticket-top">
      <span class="ticket-id">#${t.ticket_id}</span>
      <span class="ticket-entity">${esc(t.phase)}.${esc(t.entity)}</span>
      <span class="ticket-status ${statusCls}">${esc(statusLabel)}</span>
    </div>
    <div class="ticket-desc">${esc(t.description)}</div>
    <div class="ticket-meta">${esc(t.issue_type)} · ${esc(t.severity)} · raised ${timeAgo(t.raised_at)}${t.assigned_to ? ' · assigned to ' + esc(t.assigned_to) : ''}</div>
    ${note}${resolvedBy}
    ${actions ? `<div class="ticket-actions">${actions}</div>` : ''}
  </div>`;
}

function parsePipeLines(text, fields){
  // "name | description | a, b, c" per line -> [{field1, field2, field3: [a,b,c]}], blank lines skipped.
  return (text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    const obj = {};
    fields.forEach((f, i) => { obj[f] = parts[i] || ''; });
    return obj;
  });
}
function formatPipeLines(items, fields){
  return (items || []).map(it => fields.map(f => Array.isArray(it[f]) ? it[f].join(', ') : (it[f]||'')).join(' | ')).join('\n');
}

/* ============================== intent change & re-sign (step 02) ============================== */
function intentDiffHtml(d, comparedWith){
  if (!d || d.first_version) return `<div class="rv-note">First version of this intent — nothing earlier to compare with.</div>`;
  if (d.unchanged) return `<div class="rv-note">Saved again with no changes from v${comparedWith}.</div>`;
  const out = [];
  const label = {name: 'name', business_outcome: 'business outcome', definition_of_done: 'definition of done'};
  d.fields_changed.forEach(f => out.push(diffLine('edited', 'mod', esc(label[f] || f))));
  if (d.sla_changed) out.push(diffLine('edited', 'mod', 'SLA'));
  d.reports_added.forEach(r => out.push(diffLine('report', 'add', `<b>${esc(r.report)}</b>${r.data_points.length ? ' — needs ' + r.data_points.map(x => `<code>${esc(x)}</code>`).join(', ') : ''}`)));
  d.reports_removed.forEach(r => out.push(diffLine('report', 'del', `<b>${esc(r.report)}</b> removed`)));
  d.reports_changed.forEach(r => {
    r.data_points_added.forEach(x => out.push(diffLine('needs', 'add', `<code>${esc(x)}</code> — ${esc(r.report)}`)));
    r.data_points_removed.forEach(x => out.push(diffLine('drops', 'del', `<code>${esc(x)}</code> — ${esc(r.report)}`)));
  });
  d.definitions_added.forEach(t => out.push(diffLine('term', 'add', `“${esc(t)}” defined`)));
  d.definitions_removed.forEach(t => out.push(diffLine('term', 'del', `“${esc(t)}” removed`)));
  d.definitions_reworded.forEach(t => out.push(diffLine('term', 'mod', `“${esc(t)}” reworded — check it still agrees with other intents`)));
  return out.join('');
}

function intentGapsHtml(g, estate){
  const leads = (estate && estate.matches) || {};
  const lead = dp => {
    const hits = leads[String(dp).trim().toLowerCase()] || [];
    if (hits.length) return ` — in the estate: ${hits.slice(0, 3).map(h => `<code>${esc(h.table)}</code>${h.null_pct != null ? ' (' + h.null_pct + '% empty)' : ''}`).join(', ')}${hits.length > 3 ? ` +${hits.length - 3} more` : ''}`;
    // searched and absent is a finding too: it has to come from a source nobody has connected yet
    return estate && estate.scan_id ? ' — not in the estate scan either' : '';
  };
  const out = [];
  g.newly_open.forEach(x => out.push(diffLine('now open', 'del', `<code>${esc(x.data_point)}</code> — ${esc(x.report)}${lead(x.data_point)}`)));
  g.newly_resolved.forEach(x => out.push(diffLine('now found', 'add', `<code>${esc(x.data_point)}</code> — ${esc(x.found_in.join(', '))}`)));
  g.no_longer_needed.forEach(x => out.push(diffLine('not needed', 'mod', `<code>${esc(x.data_point)}</code> — ${esc(x.report)}`)));
  g.still_open.forEach(x => out.push(diffLine('still open', 'del', `<code>${esc(x.data_point)}</code> — ${esc(x.report)}${lead(x.data_point)}`)));
  const count = g.open_before === null || g.open_before === undefined
    ? `${g.open_now} open` : `${g.open_before} → ${g.open_now} open`;
  const found = Object.keys(leads).length;
  const note = estate && estate.note ? `<div class="intent-help" style="margin-top:6px;">${esc(estate.note)}</div>`
    : (found ? `<div class="intent-help" style="margin-top:6px;">Estate matches are exact column names from the latest estate scan — profile that table to close the gap.</div>` : '');
  return `<div class="rv-note" style="margin-bottom:4px;">${count} for this intent</div>${out.join('') || '<div class="rv-note">No data point changed status.</div>'}${note}`;
}

async function loadIntentChanges(intentId, version){
  const host = document.getElementById('intentChanges');
  if (!host || !intentId || intentId === '__new__') return;
  try {
    const q = `domain=${encodeURIComponent(currentDomain)}&intent_id=${encodeURIComponent(intentId)}&target=${encodeURIComponent(currentTarget)}` + (version ? `&version=${version}` : '');
    const r = await api(`/api/intent/changes?${q}`);
    const v = await r.json();
    if (!r.ok) throw new Error(v.detail || r.statusText);
    const m = v.meta;
    if (!m) { host.innerHTML = `<div class="rv-note" style="margin-top:14px;">Captured before versioning — the next save starts its history.</div>`; return; }
    const latest = v.history[v.history.length - 1].version;
    const rv = m.review || {};
    const pills = [...v.history].reverse().map(h => `<button class="${h.version === m.version ? 'on' : ''}" onclick="loadIntentChanges('${esc(intentId)}', ${h.version})">v${h.version} ${statusChip((h.review || {}).status, 'unsigned')}</button>`).join('');
    const stale = (v.stale || []).map(x => diffLine('re-check', 'mod', `<b>${esc(x.artifact)}</b> — ${esc(x.why)}`)).join('');
    let sign = '';
    if (m.version === latest && rv.status !== 'signed') {
      sign = `<div class="rv-decide">
        <input id="intentSignComment" placeholder="Comment (optional)" aria-label="Sign-off comment">
        <button class="btn primary" onclick="signIntentVersion('${esc(intentId)}', ${m.version})">Sign off v${m.version}</button>
      </div>`;
    } else if (rv.status === 'signed') {
      sign = `<div class="rv-decide"><span class="rv-signed">Signed off by ${esc(rv.by)} · ${timeAgo(rv.at)}${rv.comment ? ' — “' + esc(rv.comment) + '”' : ''}</span></div>`;
    } else {
      sign = `<div class="rv-decide"><span class="rv-note">An earlier version — only the current one (v${latest}) can be signed.</span></div>`;
    }
    host.innerHTML = `<div style="border-top:1px solid var(--border-soft);margin-top:16px;padding-top:14px;">
      <div class="rv-head">
        <h3 style="font-size:13px;">Version history</h3>
        <span class="rv-ver">v${m.version}${v.compared_with ? ' · compared with v' + v.compared_with : ''} · ${esc(m.reason)} by ${esc(m.created_by)} · ${timeAgo(m.created_at)}</span>
        ${statusChip(rv.status, 'awaiting sign-off')}
      </div>
      <div class="rv-hist-row">${pills}</div>
      <div class="rv-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);">
        <div class="rv-sec"><h4>What changed</h4>${intentDiffHtml(v.diff, v.compared_with)}</div>
        <div class="rv-sec"><h4>What it did to gaps</h4>${intentGapsHtml(v.gaps, v.estate)}</div>
      </div>
      ${stale ? `<div class="rv-sec"><h4>Now out of date</h4>${stale}</div>` : ''}
      ${sign}
      <div id="intentSignResult"></div>
    </div>`;
  } catch (e) {
    host.innerHTML = `<div class="conn-result bad">Could not load version history: ${esc(e.message)}</div>`;
  }
}
window.loadIntentChanges = loadIntentChanges;

function gapResultsHtml(report){
  if (!report.intent_captured) return `<div class="empty-note">No intent captured yet for ${esc(currentDomain)} — save one above first.</div>`;
  const gapRows = (report.data_point_gaps||[]).map(g => `<div class="gap-row ${g.status}">
    <span class="gst">${g.status === 'resolved' ? '✓ found' : '✕ open'}</span>
    <span class="gname">${esc(g.data_point)}</span>
    <span class="gwhere">${esc(g.intent ? g.intent + ' — ' : '')}${esc(g.report)}${g.found_in.length ? ' — found in ' + g.found_in.map(esc).join(', ') : ' — not found in any known source'}</span>
  </div>`).join('') || `<div class="empty-note">No reports declared required data points yet.</div>`;
  const conflictRows = (report.definition_conflicts||[]).map(c => `<div class="conflict-row">
    <span class="term">${esc(c.term)}</span> has ${c.definitions.length} different definitions across intents:
    <ul>${c.definitions.map(d => `<li>"${esc(d.definition)}"${d.intent ? ' — ' + esc(d.intent) : ''}${d.source ? ' (' + esc(d.source) + ')' : ''}</li>`).join('')}</ul>
  </div>`).join('');
  return `<div style="margin-bottom:14px;">
      <b style="color:${report.open_count ? 'var(--critical)' : 'var(--good)'};font-family:'IBM Plex Mono';font-size:13px;">
        ${report.open_count} open item${report.open_count===1?'':'s'}
      </b>
      <span class="empty-note" style="padding:0;margin-left:8px;">— this is exactly what G1 checks at Freeze approval</span>
    </div>
    ${gapRows}${conflictRows}`;
}

let currentDiagramLevel = 'high';
// Drawn from the theme tokens so the diagram reads on the light surface it sits on, rather
// than carrying its own hardcoded palette that only worked against the old dark panel.
const DIAGRAM_LAYER_COLOR = {source: '#6A7B8C', bronze: '#A9682F', silver: '#5B44A8', gold: '#9A7A0E'};
const DIAGRAM_NODE_FILL = '#FFFFFF', DIAGRAM_NODE_TEXT = '#0D1B2A', DIAGRAM_EDGE = '#C3CFD9';

function renderHighLevelSvg(d){
  const layers = ['source', 'bronze', 'silver', 'gold'];
  const layerLabel = {source: 'Source', bronze: 'Bronze', silver: 'Silver', gold: 'Gold'};
  const colW = 190, rowH = 34, padTop = 30, padX = 16;
  const byLayer = {}; layers.forEach(l => byLayer[l] = d.nodes.filter(n => n.layer === l));
  const maxRows = Math.max(1, ...layers.map(l => byLayer[l].length));
  const width = padX*2 + colW*layers.length;
  const height = padTop + rowH*maxRows + 30;
  const pos = {};
  layers.forEach((l, ci) => {
    byLayer[l].forEach((n, ri) => {
      pos[n.id] = {x: padX + ci*colW, y: padTop + ri*rowH, layer: l};
    });
  });
  let svg = `<svg viewBox="0 0 ${width} ${Math.max(height,200)}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:'IBM Plex Mono',monospace;">`;
  layers.forEach((l, ci) => {
    svg += `<text x="${padX + ci*colW + 78}" y="18" fill="${DIAGRAM_LAYER_COLOR[l]}" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">${layerLabel[l].toUpperCase()} (${d.counts[l]})</text>`;
  });
  d.edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const x1 = a.x + 156, y1 = a.y + 12, x2 = b.x, y2 = b.y + 12;
    const mx = (x1+x2)/2;
    svg += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="${DIAGRAM_EDGE}" stroke-width="1.2" fill="none"/>`;
  });
  d.nodes.forEach(n => {
    const p = pos[n.id]; if (!p) return;
    const color = DIAGRAM_LAYER_COLOR[n.layer];
    svg += `<g><rect x="${p.x}" y="${p.y}" width="156" height="24" rx="6" fill="${DIAGRAM_NODE_FILL}" stroke="${color}" stroke-opacity="0.6"/>
      <text x="${p.x+9}" y="${p.y+16}" fill="${DIAGRAM_NODE_TEXT}" font-size="10.5">${escSvg(n.label)}</text></g>`;
  });
  svg += `</svg>`;
  return svg;
}

function escSvg(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderLowLevelHtml(d){
  if (!d.nodes.length) return `<div class="empty-note">No silver dimensions/facts contracted yet for ${esc(currentDomain)}.</div>`;
  return d.nodes.map(n => {
    const fks = d.edges.filter(e => e.from === n.id);
    return `<div class="ll-card">
      <div class="ll-top"><span class="ll-kind ${esc(n.kind)}">${esc(n.kind)}</span>
        <span class="ll-name">${esc(n.label)}</span>
        <span class="empty-note" style="padding:0;margin-left:auto;">${esc(n.type||'')}</span></div>
      <div class="ll-cols">${(n.columns||[]).map(c => `<span>${esc(c)}</span>`).join('') || '<span>no columns declared</span>'}</div>
      ${fks.length ? `<div class="ll-fk">→ ${fks.map(f => `<b>${esc(f.to)}</b>${f.label ? ' on ' + esc(f.label) : ''}`).join(', ')}</div>` : ''}
    </div>`;
  }).join('');
}

async function sendChatMessage(kind){
  const input = document.getElementById(`chatInput-${kind}`);
  const text = input.value.trim();
  if (!text) return;
  const log = document.getElementById(`chatLog-${kind}`);
  const state = chatState[kind];
  log.insertAdjacentHTML('beforeend', chatBubbleHtml('user', text));
  input.value = '';
  log.scrollTop = log.scrollHeight;
  const thinkingId = `thinking-${kind}`;
  log.insertAdjacentHTML('beforeend', `<div class="chat-bubble assistant" id="${thinkingId}">…</div>`);
  log.scrollTop = log.scrollHeight;
  try {
    const r = await api('/api/catalogue/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({kind, domain: currentDomain, history: state.history, message: text})});
    const j = await r.json();
    document.getElementById(thinkingId)?.remove();
    if (!r.ok) { log.insertAdjacentHTML('beforeend', chatBubbleHtml('assistant', 'Error: ' + (j.detail || 'could not reach the agent'))); return; }
    state.history.push({role: 'user', text});
    state.history.push({role: 'assistant', text: j.reply});
    log.insertAdjacentHTML('beforeend', chatBubbleHtml('assistant', j.reply));
    if (j.suggestion) { log.insertAdjacentHTML('beforeend', chatSuggestionHtml(kind, j.suggestion)); loadMemoryUI(); }
    log.scrollTop = log.scrollHeight;
  } catch (e) {
    document.getElementById(thinkingId)?.remove();
    log.insertAdjacentHTML('beforeend', chatBubbleHtml('assistant', 'Error: ' + e.message));
  }
}

const SERIES_COLORS = ['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)','var(--series-5)','var(--series-6)'];

function fmtMetric(value, format){
  if (value === null || value === undefined) return '—';
  if (format === 'currency_usd') return '$' + Number(value).toLocaleString(undefined, {maximumFractionDigits:0});
  if (format === 'percent') return (Number(value) * 100).toFixed(1) + '%';
  if (format === 'integer') return Math.round(Number(value)).toLocaleString();
  return typeof value === 'number' ? value.toLocaleString(undefined, {maximumFractionDigits:2}) : String(value);
}

function renderBarChart(tile){
  const data = tile.data || [];
  if (!data.length) return `<div class="empty-note">No data.</div>`;
  const seriesVals = [...new Set(data.map(d => d.series).filter(v => v !== null && v !== undefined))];
  const xVals = [...new Set(data.map(d => d.x === null ? '(unmapped)' : d.x))];
  const byX = {};
  data.forEach(d => {
    const xk = d.x === null ? '(unmapped)' : d.x;
    (byX[xk] = byX[xk] || {})[d.series ?? '_'] = d.value;
  });
  const seriesKeys = seriesVals.length ? seriesVals : ['_'];
  const maxVal = Math.max(1, ...data.map(d => d.value || 0));

  const W = 640, H = 220, padL = 4, padB = 26, padT = 8, padR = 4;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const groupW = plotW / xVals.length;
  const barGap = 3, groupPad = 10;
  const barW = Math.max(4, (groupW - groupPad * 2 - barGap * (seriesKeys.length - 1)) / seriesKeys.length);

  let bars = '';
  xVals.forEach((xk, gi) => {
    const gx = padL + gi * groupW + groupPad;
    seriesKeys.forEach((sk, si) => {
      const val = (byX[xk] || {})[sk];
      if (val === undefined) return;
      const h = Math.max(1, (val / maxVal) * plotH);
      const bx = gx + si * (barW + barGap);
      const by = padT + plotH - h;
      const color = seriesVals.length ? SERIES_COLORS[si % SERIES_COLORS.length] : 'var(--accent)';
      const label = esc(String(xk)) + (sk !== '_' ? ' · ' + esc(String(sk)) : '') + '<br><b>' + esc(fmtMetric(val, tile.format)) + '</b>';
      bars += `<rect class="bc-bar" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}"
        onmousemove="showBcTooltip(event, '${label.replace(/'/g, "\\'")}')" onmouseleave="hideBcTooltip()"></rect>`;
    });
    const lx = padL + gi * groupW + groupW / 2;
    bars += `<text class="bc-axis-label" x="${lx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(String(xk)).slice(0,10)}</text>`;
  });
  const baseline = `<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--border)" stroke-width="1"/>`;
  const legend = seriesVals.length ? `<div class="bc-legend">${seriesVals.map((s,i) =>
    `<div class="bc-legend-item"><span class="bc-legend-swatch" style="background:${SERIES_COLORS[i % SERIES_COLORS.length]}"></span>${esc(String(s))}</div>`).join('')}</div>` : '';
  return `<div class="barchart"><svg viewBox="0 0 ${W} ${H}">${baseline}${bars}</svg></div>${legend}`;
}

function renderKpi(tile){
  return `<div class="kpi-value">${esc(fmtMetric(tile.value, tile.format))}</div><div class="kpi-label">${esc(tile.metric)}</div>`;
}

function renderDashTable(tile){
  const cols = tile.columns || [];
  const rows = tile.rows || [];
  const formats = tile.formats || [];
  if (!rows.length) return `<div class="empty-note">No data.</div>`;
  const head = cols.map(c => `<th>${esc(c)}</th>`).join('');
  const body = rows.map(r => `<tr>${r.map((v,i) => `<td>${esc(v===null?'(unmapped)':(typeof v==='number'?fmtMetric(v, formats[i]):v))}</td>`).join('')}</tr>`).join('');
  return `<table class="dash-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function dashTileHtml(tile){
  const title = tile.metric ? tile.metric.replace(/_/g,' ') : (tile.mart || 'table').replace(/_/g,' ');
  const sizeClass = tile.type === 'table' ? 'tile-table' : (tile.type === 'kpi' ? 'tile-kpi' : '');
  if (tile.error) {
    return `<div class="dash-tile ${sizeClass}"><div class="dash-tile-title">${esc(title)}</div>
      <div class="dash-tile-error">✕ ${esc(tile.error)}</div></div>`;
  }
  let body = '';
  if (tile.type === 'bar') body = renderBarChart(tile);
  else if (tile.type === 'kpi') body = renderKpi(tile);
  else if (tile.type === 'table') body = renderDashTable(tile);
  else body = `<div class="dash-tile-error">Unknown tile type ${esc(tile.type)}</div>`;
  const sub = tile.mart ? `<div class="dash-tile-sub">${esc(tile.mart)}</div>` : '';
  return `<div class="dash-tile ${sizeClass}">${tile.type!=='kpi'?`<div class="dash-tile-title">${esc(title)}</div>${sub}`:''}${body}</div>`;
}

let lastDashboard = null;

async function fetchAndRenderDashboard(clearMessage){
  // Shared by a plain refresh (clears #dashResult -- nothing to preserve) and post-save
  // (does NOT clear it -- the save's own success message would otherwise be wiped the instant
  // it's shown, the same bug class already fixed once for profileConnection()/reloadJourney()
  // in Phase G. #dashResult is only ever touched here for "skipped" notes or errors.
  const resultEl = document.getElementById('dashResult');
  const gridEl = document.getElementById('dashGrid');
  const badgeEl = document.getElementById('dashBadge');
  const saveBtn = document.getElementById('dashSaveBtn');
  if (clearMessage) resultEl.innerHTML = '';
  gridEl.innerHTML = `<div class="empty-note">Loading…</div>`;
  try {
    const r = await api(`/api/dashboard?domain=${encodeURIComponent(currentDomain)}&target=${encodeURIComponent(currentTarget)}`);
    const d = await r.json();
    if (!r.ok || d.ok === false) { gridEl.innerHTML = `<div class="empty-note">Could not load dashboard: ${esc(d.detail || d.reason || 'error')}</div>`; return; }
    lastDashboard = d;
    badgeEl.innerHTML = d.proposed
      ? `<span class="dash-badge proposed">Proposed — not yet saved</span>`
      : `<span class="dash-badge saved">Saved to contract</span>`;
    saveBtn.style.display = d.proposed ? '' : 'none';
    if (d.skipped && d.skipped.length) {
      resultEl.innerHTML = `<div class="intent-help">Skipped: ${d.skipped.map(esc).join('; ')}</div>`;
    }
    gridEl.innerHTML = d.tiles.map(dashTileHtml).join('') || `<div class="empty-note">No tiles.</div>`;
  } catch (e) {
    gridEl.innerHTML = `<div class="empty-note">Could not load dashboard: ${esc(e.message)}</div>`;
  }
}

function loadDashboardUI(){ return fetchAndRenderDashboard(true); }
window.loadDashboardUI = loadDashboardUI;

async function saveDashboardUI(){
  if (!lastDashboard) return;
  const resultEl = document.getElementById('dashResult');
  resultEl.innerHTML = `<div class="conn-result">Saving…</div>`;
  try {
    // Save the tile SPEC (not the rendered data/values) -- strip render-only fields before
    // writing back to the contract, so the saved dashboard stays a spec, not a data snapshot.
    const specTiles = lastDashboard.tiles.map(t => {
      const {data, value, rows, columns, formats, error, mart, format, ...spec} = t;
      return spec;
    });
    const r = await api('/api/dashboard', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({domain: currentDomain, name: lastDashboard.name, tiles: specTiles})});
    const j = await r.json();
    if (!r.ok || !j.ok) { resultEl.innerHTML = `<div class="conn-result bad">✕ ${esc(j.reason || j.detail || 'save failed')}</div>`; return; }
    resultEl.innerHTML = `<div class="conn-result ok">✓ Saved to contracts/semantics/${esc(currentDomain)}.gold.yaml</div>`;
    await fetchAndRenderDashboard(false);
  } catch (e) {
    resultEl.innerHTML = `<div class="conn-result bad">✕ ${esc(e.message)}</div>`;
  }
}
window.saveDashboardUI = saveDashboardUI;

/* ============================== uploads ============================== */
function wireDropzone(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  if (!dropzone) return;
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.onchange = () => { if (fileInput.files[0]) uploadFile(fileInput.files[0]); };
  ['dragenter','dragover'].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) uploadFile(f); });
}

async function uploadFile(file){
  const fd = new FormData();
  fd.append('kind', 'intake');
  fd.append('file', file);
  const r = await api('/api/uploads', {method:'POST', body:fd});
  if (!r.ok) { alert('Upload failed: ' + (await r.json()).detail); return; }
  await loadUploads();
}

let latestUploadPath = null;

async function loadUploads(){
  const el = document.getElementById('uploadList'); if (!el) return;
  const r = await api('/api/uploads'); const j = await r.json();
  latestUploadPath = j.uploads.length ? j.uploads[0].stored_path : null;
  if (!j.uploads.length) { el.innerHTML = `<div class="empty-note">No catalogues uploaded yet.</div>`; return; }
  el.innerHTML = j.uploads.map(u => {
    const previewOk = u.preview && u.preview.ok;
    const chip = u.compiled ? `<div class="status-chip compiled">Compiled</div>`
               : previewOk ? `<div class="status-chip review">Preview ready</div>`
               : `<div class="status-chip error">Compile error</div>`;
    const btn = u.compiled ? "" : (previewOk
      ? `<button class="btn primary" onclick="startAgentRun('${esc(u.id)}')">Run via Agent</button>
         <button class="btn ghost" onclick="approveUpload('${esc(u.id)}')">Compile directly</button>`
      : `<button class="btn ghost" disabled>Fix &amp; re-upload</button>`);
    const out = u.compiled ? (u.compile_result.stdout || u.compile_result.stderr) : (u.preview.stdout || u.preview.stderr);
    return `<div class="upload-row">
      <div class="upload-meta">
        <div class="name">${esc(u.filename)}</div>
        <div class="sub">intake workbook · ${new Date(u.uploaded_at*1000).toLocaleString()}</div>
        <pre>${esc((out||'').slice(-1200))}</pre>
      </div>
      <div class="upload-actions">${chip}${btn}</div>
    </div>`;
  }).join('');
}

async function approveUpload(id){
  const r = await api(`/api/uploads/${id}/approve`, {method:'POST'});
  if (!r.ok) { alert('Compile failed: ' + (await r.json()).detail); }
  await loadUploads(); await reloadJourney();
}
window.approveUpload = approveUpload;

/* ============================== agent runs ============================== */
async function startAgentRun(uploadId){
  const fd = new FormData();
  fd.append('upload_id', uploadId);
  fd.append('domain_hint', currentDomain);
  const r = await api('/api/agent-runs', {method:'POST', body:fd});
  if (!r.ok) { alert('Could not start agent run: ' + (await r.json()).detail); return; }
  await loadAgentRuns();
}
window.startAgentRun = startAgentRun;

async function approveRun(runId){
  const r = await api(`/api/agent-runs/${runId}/approve`, {method:'POST'});
  if (!r.ok) { alert('Could not approve: ' + (await r.json()).detail); return; }
  await loadAgentRuns();
}
window.approveRun = approveRun;

async function rejectRun(runId){
  const r = await api(`/api/agent-runs/${runId}/reject`, {method:'POST'});
  if (!r.ok) { alert('Could not reject: ' + (await r.json()).detail); return; }
  await loadAgentRuns();
}
window.rejectRun = rejectRun;

function renderRunCard(run){
  const started = new Date((run.started_at||'').replace(' ', 'T') + 'Z');
  const stagesHtml = (run.stages || []).map(s =>
    `<div class="run-stage-row"><span class="sname2">${esc(s.stage)}</span><span>${esc(s.agent)} — ${esc(s.detail || s.status)}</span></div>`
  ).join('') || `<div class="run-stage-row"><span>no stages logged yet</span></div>`;
  const g = run.pending_action && run.pending_action.gate;
  return `<div class="run-card">
    <div class="run-top">
      <div>
        <div class="run-title">${esc(run.domain)} <span style="color:var(--text-muted);font-weight:400;">/ ${esc(run.client)}</span></div>
        <div class="run-sub">${esc((run.run_id||'').slice(0,8))} · ${isNaN(started) ? '' : started.toLocaleTimeString()} · ${esc(run.started_by)}</div>
      </div>
      <div class="run-status ${esc(run.status)}">${esc((run.status||'').replace('_',' '))}${g ? ' · '+esc(g.id) : ''}</div>
    </div>
    <div class="run-stages">${stagesHtml}</div>
  </div>`;
}

async function loadAgentRuns(){
  try {
    const r = await api('/api/agent-runs');
    const j = await r.json();
    const details = await Promise.all(j.runs.map(run => api(`/api/agent-runs/${run.run_id}`).then(x => x.ok ? x.json() : run)));
    pendingRuns = details;
    renderAttention();
    renderRail();
    const el = document.getElementById('agentRuns');
    if (el) el.innerHTML = details.length ? details.map(renderRunCard).join('')
      : `<div class="empty-note">No agent runs yet — upload a workbook on step 02 and click "Run via Agent".</div>`;
    refreshGatesInPlace();
  } catch (e) {
    const el = document.getElementById('agentRuns');
    if (el) el.innerHTML = `<div class="empty-note">Could not load agent runs: ${esc(e.message)}</div>`;
  }
}

/* ============================== boot ============================== */
async function ensureAuthed(){
  const cred = getCred();
  const r = await fetch(API_BASE + '/api/targets', {headers: cred ? {Authorization: 'Basic ' + cred} : {}});
  if (r.status === 401) { clearCred(); await showLogin(); }
}

(async function(){
  await ensureAuthed();
  await loadMe();
  await Promise.all([loadTargets(), loadDomains()]);
  await reloadJourney();
  await loadAgentRuns();
  setInterval(loadAgentRuns, 15000);
  setInterval(() => { if (currentStep === 3) refreshFlow(); }, 20000);
  setInterval(() => { if (currentStep === 5) refreshAlerts(); }, 15000);
})();
</script>
