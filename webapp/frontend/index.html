<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundation First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    /* Light product palette. Cool-grey ground with a slight blue bias (chosen, not inherited),
       deep navy-slate ink, and a deep teal accent that reads as "verified" rather than neon.
       Semantic colours are kept off the accent hue so state never competes with brand. */
    --bg:#F4F7F9; --bg-panel:#FFFFFF; --bg-panel-2:#EDF1F5; --bg-raised:#E4EAF0;
    --border:#D7DFE6; --border-soft:#E8EDF1;
    --text-primary:#0D1B2A; --text-secondary:#44586B; --text-muted:#7C8B99;
    --accent:#0B6E5F; --accent-ink:#08544A; --accent-dim:#DDEDE9;
    --accent-soft:#DDEDE9; --accent-line:#8FC9BE;
    --bronze:#A9682F; --bronze-soft:#F6E8DB;
    --silver:#6A7B8C; --silver-soft:#E7ECF1;
    --gold:#9A7A0E; --gold-soft:#FAF0D6; --gold-line:#DFC682;
    --good:#1A7A48; --good-soft:#E0F0E7; --good-line:#9AD0B2;
    --warning:#A96C0A; --warning-soft:#FBEEDA; --warning-line:#E6C68A;
    --serious:#A9540A;
    --critical:#A92318; --critical-soft:#FBE4E1; --critical-line:#E3A9A2;
    --muted-soft:#EAEFF3; --muted-line:#CBD5DD;
    --violet:#5B44A8; --violet-soft:#EAE5F7;
    --shadow:0 1px 2px rgba(13,27,42,.04), 0 4px 14px rgba(13,27,42,.05);
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text-primary);font-family:'IBM Plex Sans',system-ui,sans-serif;
       margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'IBM Plex Sans',system-ui,sans-serif;text-wrap:balance;margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  button{font-family:inherit;}

  /* ---------------- top bar ---------------- */
  .topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
          padding:18px 24px;border-bottom:1px solid var(--border-soft);background:var(--bg-panel);}
  .brand{display:flex;align-items:center;gap:13px;}
  .mark{width:30px;height:30px;flex:none;}
  .brand-text h1{font-size:19px;font-weight:700;letter-spacing:.2px;}
  .brand-text .sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .header-right{display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
  select#target,select#domain{
    background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text-primary);
    font-size:12.5px;padding:7px 12px;border-radius:20px;font-family:inherit;cursor:pointer;
  }
  .conn-pills{display:flex;gap:8px;}
  .pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;
        background:var(--bg-panel-2);border:1px solid var(--border);font-size:12px;color:var(--text-secondary);}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good);}
  .pill.err .dot{background:var(--critical);}
  .live-badge{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;
              background:var(--accent-soft);border:1px solid var(--accent-line);
              color:var(--accent);font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
  .live-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .user-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
              background:var(--bg-panel-2);border:1px solid var(--border-soft);
              color:var(--text-secondary);font-size:11.5px;font-weight:600;}
  .user-badge .scope{color:var(--text-muted);font-weight:500;font-family:'IBM Plex Mono';font-size:10.5px;}

  /* ---------------- shell: rail + stage ---------------- */
  .shell{display:grid;grid-template-columns:268px 1fr;min-height:calc(100vh - 76px);align-items:start;}
  .rail{border-right:1px solid var(--border-soft);padding:20px 14px 40px;position:sticky;top:0;
        display:flex;flex-direction:column;gap:3px;}
  .rail-title{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
              color:var(--text-muted);padding:0 10px 10px;}
  .step-btn{display:grid;grid-template-columns:30px 1fr;gap:11px;align-items:start;text-align:left;
            padding:11px 10px;border-radius:10px;background:transparent;border:1px solid transparent;
            cursor:pointer;color:var(--text-secondary);width:100%;}
  .step-btn:hover{background:var(--bg-panel-2);}
  .step-btn.sel{background:var(--bg-panel-2);border-color:var(--border);}
  .step-btn .sn{font-family:'IBM Plex Mono';font-size:11px;color:var(--text-muted);
                border:1px solid var(--border);border-radius:7px;padding:4px 0;text-align:center;}
  .step-btn.sel .sn{color:var(--accent);border-color:var(--accent-line);}
  .step-btn .sname{font-family:'IBM Plex Sans';font-size:13px;font-weight:600;color:var(--text-primary);line-height:1.3;}
  .step-btn .smeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center;}
  .cap{font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;}
  .cap.live{background:var(--good-soft);color:var(--good);}
  .cap.partial{background:var(--warning-soft);color:var(--warning);}
  .cap.planned{background:var(--muted-soft);color:var(--text-muted);}
  .gbadge{font-family:'IBM Plex Mono';font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:5px;
          background:var(--bg-raised);color:var(--text-muted);border:1px solid var(--border-soft);}
  .gbadge.passed{color:var(--good);border-color:var(--good-line);}
  .gbadge.pending{color:var(--gold);border-color:var(--gold-line);animation:blink 1.4s infinite;}

  .stage{padding:26px 28px 70px;min-width:0;max-width:1180px;}

  /* ---------------- screen header ---------------- */
  .screen-head{margin-bottom:22px;}
  .screen-head .eyebrow{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:1.6px;
                        text-transform:uppercase;color:var(--accent);}
  .screen-head h2{font-size:23px;font-weight:700;margin-top:6px;}
  .screen-head .tagline{font-size:13.5px;color:var(--text-secondary);margin-top:7px;max-width:74ch;}
  .who-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;}
  .who{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;font-size:11.5px;
       background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-secondary);}
  .who i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;}
  .who b{color:var(--text-primary);font-weight:600;}

  .panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;
         padding:20px 20px 22px;box-shadow:var(--shadow);margin-bottom:18px;}
  .panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .panel-head h3{font-size:15px;font-weight:700;}
  .panel-head .note{font-size:12px;color:var(--text-muted);}

  /* ---------------- gap notice ---------------- */
  .gap{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;padding:13px 15px;
       border-radius:11px;background:var(--muted-soft);border:1px dashed var(--border);margin-bottom:18px;}
  .gap .ic{font-family:'IBM Plex Mono';font-size:11px;color:var(--text-muted);padding-top:1px;}
  .gap .tx{font-size:12.5px;color:var(--text-muted);line-height:1.6;}
  .gap .tx b{color:var(--text-secondary);font-weight:600;}

  /* ---------------- gates ---------------- */
  .gate{border-radius:12px;padding:15px 17px;margin-bottom:12px;border:1px solid var(--border-soft);
        background:var(--bg-panel-2);}
  .gate.pending{border-color:var(--gold-line);background:var(--gold-soft);}
  .gate.passed{border-color:var(--good-line);}
  .gate-top{display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
  .gid{font-family:'IBM Plex Mono';font-size:12px;font-weight:600;color:var(--gold);}
  .gate.planned .gid{color:var(--text-muted);}
  .gate.passed .gid{color:var(--good);}
  .gname{font-family:'IBM Plex Sans';font-size:14px;font-weight:600;}
  .gstate{margin-left:auto;font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
          padding:3px 9px;border-radius:20px;}
  .gstate.pending{background:var(--gold-soft);color:var(--gold);animation:blink 1.5s infinite;}
  .gstate.passed{background:var(--good-soft);color:var(--good);}
  .gstate.waiting{background:var(--muted-soft);color:var(--text-muted);}
  .gstate.planned{background:var(--muted-soft);color:var(--text-muted);}
  .gapproves{font-size:12.5px;color:var(--text-secondary);margin-top:9px;}
  .grule{font-size:11.5px;color:var(--text-muted);margin-top:7px;padding-left:11px;border-left:2px solid var(--border);}
  .grec{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--good);margin-top:9px;}
  .gargs{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--text-secondary);background:var(--bg-raised);
         border-radius:7px;padding:9px 11px;margin:10px 0 0;white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:auto;}
  .gate-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  /* ---------------- attention bar ---------------- */
  .attn{border:1px solid var(--gold-line);background:var(--gold-soft);border-radius:13px;
        padding:14px 17px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:11px 15px;align-items:center;}
  .attn .lbl{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
             color:var(--gold);font-weight:600;}
  .attn .tx{font-size:13px;color:var(--text-secondary);flex:1;min-width:220px;}
  .attn .tx b{color:var(--text-primary);font-weight:600;}

  /* ---------------- stat tiles ---------------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;}
  .stat{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:11px;padding:14px 15px;}
  .stat b{display:block;font-family:'IBM Plex Mono';font-size:21px;font-weight:600;}
  .stat span{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
  .stat.muted b{color:var(--text-muted);}

  /* ---------------- medallion flow ---------------- */
  .flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;}
  @media (max-width:900px){.flow{grid-template-columns:1fr;gap:12px;} .flow .arrow{display:none;}}
  .layer-card{background:var(--bg-panel-2);border:1px solid var(--border);border-radius:14px;padding:16px;
              display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden;}
  .layer-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--layer-color);}
  .layer-top{display:flex;justify-content:space-between;align-items:center;}
  .layer-name{font-family:'IBM Plex Sans';font-weight:700;font-size:14.5px;color:var(--layer-color);}
  .layer-status{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:20px;}
  .layer-status.healthy{background:var(--good-soft);color:var(--good);}
  .layer-status.empty{background:var(--muted-soft);color:var(--text-muted);}
  .layer-status.attention{background:var(--critical-soft);color:var(--critical);}
  .layer-stats{display:flex;gap:17px;}
  .layer-stats .stat2 b{display:block;font-family:'IBM Plex Mono';font-size:18px;font-weight:600;}
  .layer-stats .stat2 span{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
  .layer-tables{display:flex;flex-wrap:wrap;gap:5px;}
  .tchip{font-family:'IBM Plex Mono';font-size:10px;padding:3px 7px;border-radius:6px;background:var(--bg-raised);
         color:var(--text-secondary);border:1px solid var(--border-soft);}
  .tchip.err{color:var(--critical);border-color:var(--critical-line);}
  .layer-sub{font-size:10.5px;color:var(--text-muted);}
  .arrow{display:flex;align-items:center;justify-content:center;padding:0 6px;}
  .arrow svg{width:32px;height:18px;}

  /* ---------------- uploads ---------------- */
  .dropzone{border:1.5px dashed var(--border);border-radius:12px;padding:20px 18px;text-align:center;
            background:var(--bg-panel-2);display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;}
  .dropzone.drag{border-color:var(--accent);}
  .dropzone svg{width:30px;height:30px;color:var(--text-muted);}
  .dropzone .dz-title{font-size:13px;font-weight:600;}
  .dropzone .dz-sub{font-size:11.5px;color:var(--text-muted);max-width:52ch;}
  .upload-row{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border-soft);}
  .upload-row:last-child{border-bottom:none;}
  .upload-meta{flex:1;min-width:0;}
  .upload-meta .name{font-size:12.5px;font-weight:600;}
  .upload-meta .sub{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .upload-meta pre{font-size:10.5px;max-height:130px;overflow:auto;background:var(--bg-raised);
                   border:1px solid var(--border-soft);border-radius:8px;padding:8px 10px;margin:8px 0 0;
                   white-space:pre-wrap;color:var(--text-secondary);}
  .upload-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none;}
  .status-chip{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;white-space:nowrap;}
  .status-chip.compiled{background:var(--good-soft);color:var(--good);}
  .status-chip.review{background:var(--warning-soft);color:var(--warning);}
  .status-chip.error{background:var(--critical-soft);color:var(--critical);}
  .btn{font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;border:none;cursor:pointer;white-space:nowrap;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
  .btn.reject{background:transparent;color:var(--critical);border:1px solid var(--critical-line);}
  input[type=file]{display:none;}

  /* ---------------- runs ---------------- */
  .run-card{border:1px solid var(--border-soft);border-radius:12px;padding:13px 15px;background:var(--bg-panel-2);margin-bottom:10px;}
  .run-card:last-child{margin-bottom:0;}
  .run-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .run-title{font-family:'IBM Plex Sans';font-weight:600;font-size:13px;}
  .run-sub{font-size:10.5px;color:var(--text-muted);margin-top:2px;font-family:'IBM Plex Mono';}
  .run-status{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:4px 10px;border-radius:20px;flex:none;}
  .run-status.running,.run-status.starting,.run-status.resuming{background:var(--accent-soft);color:var(--accent);}
  .run-status.awaiting_approval{background:var(--warning-soft);color:var(--warning);animation:blink 1.8s infinite;}
  .run-status.completed{background:var(--good-soft);color:var(--good);}
  .run-status.failed,.run-status.rejected{background:var(--critical-soft);color:var(--critical);}
  .run-stages{display:flex;flex-direction:column;gap:4px;margin-top:9px;}
  .run-stage-row{font-size:11.5px;color:var(--text-secondary);display:flex;gap:8px;}
  .run-stage-row .sname2{font-family:'IBM Plex Mono';color:var(--text-muted);min-width:58px;}

  /* ---------------- alerts ---------------- */
  .alert-feed{display:flex;flex-direction:column;gap:9px;}
  .alert-item{display:flex;gap:10px;padding:11px 12px;border-radius:10px;background:var(--bg-panel-2);border:1px solid var(--border-soft);}
  .alert-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;}
  .alert-dot.ok{background:var(--good);box-shadow:0 0 6px var(--good);}
  .alert-dot.fail{background:var(--critical);box-shadow:0 0 6px var(--critical);}
  .alert-body .t{font-size:12.5px;font-weight:600;}
  .alert-body .s{font-size:11px;color:var(--text-muted);margin-top:2px;font-family:'IBM Plex Mono';}
  .empty-note{font-size:12px;color:var(--text-muted);padding:8px 2px;}

  .srclist{display:flex;flex-wrap:wrap;gap:6px;}

  /* ---------------- discovery (step 01) ---------------- */
  .conn-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px;align-items:end;}
  .conn-form label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--text-muted);
                   text-transform:uppercase;letter-spacing:.4px;}
  .conn-form input,.conn-form select{background:var(--bg-panel-2);border:1px solid var(--border);
                   color:var(--text-primary);font-size:12.5px;padding:8px 10px;border-radius:8px;font-family:inherit;}
  .conn-form .chk{flex-direction:row;align-items:center;gap:7px;}
  .conn-form .chk input{width:auto;}
  .conn-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}
  .conn-result{margin-top:11px;padding:9px 12px;border-radius:9px;font-size:12px;font-family:'IBM Plex Mono';}
  .conn-result.ok{background:var(--good-soft);color:var(--good);border:1px solid var(--good-line);}
  .conn-result.bad{background:var(--critical-soft);color:var(--critical);border:1px solid var(--critical-line);}

  .profile-card{border:1px solid var(--border-soft);border-radius:12px;padding:15px 16px;background:var(--bg-panel-2);margin-bottom:12px;}
  .profile-card:last-child{margin-bottom:0;}
  .profile-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .profile-top .pname{font-family:'IBM Plex Sans';font-weight:600;font-size:14px;}
  .profile-top .ptype{font-family:'IBM Plex Mono';font-size:10px;color:var(--text-muted);
                      padding:2px 8px;border:1px solid var(--border-soft);border-radius:6px;}
  .profile-top .prows{margin-left:auto;font-size:11px;color:var(--text-muted);font-family:'IBM Plex Mono';}
  .coltable{width:100%;border-collapse:collapse;margin-top:11px;font-size:11.5px;}
  .coltable th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);
              padding:6px 8px;border-bottom:1px solid var(--border-soft);}
  .coltable td{padding:6px 8px;border-bottom:1px solid var(--border-soft);color:var(--text-secondary);vertical-align:top;}
  .coltable tr:last-child td{border-bottom:none;}
  .coltable .cname{color:var(--text-primary);font-weight:600;font-family:'IBM Plex Mono';font-size:11px;}
  .coltable .ctype{font-family:'IBM Plex Mono';color:var(--accent);}
  .coltable .key{display:inline-block;margin-left:6px;font-size:9px;padding:1px 6px;border-radius:20px;
                 background:var(--gold-soft);color:var(--gold);font-weight:600;}
  .coltable .samples{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--text-muted);}

  .extract-wrap{margin-top:13px;padding-top:13px;border-top:1px solid var(--border-soft);}
  .extract-card{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;
                padding:12px 14px;margin-bottom:9px;}
  .extract-card:last-child{margin-bottom:0;}
  .extract-file{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--text-muted);margin-bottom:6px;}
  .extract-summary{font-size:12.5px;color:var(--text-primary);margin-bottom:10px;line-height:1.5;}
  .extract-err{font-size:11.5px;color:var(--critical);}
  .extract-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;}
  .extract-field{font-size:11px;display:flex;gap:6px;overflow:hidden;}
  .extract-field .k{font-family:'IBM Plex Mono';color:var(--text-muted);flex:none;}
  .extract-field .v{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------------- intent (step 02) ---------------- */
  .intent-form{display:flex;flex-direction:column;gap:12px;}
  .intent-form label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--text-muted);
                     text-transform:uppercase;letter-spacing:.4px;}
  .intent-form input,.intent-form textarea{background:var(--bg-panel-2);border:1px solid var(--border);
                     color:var(--text-primary);font-size:12.5px;padding:9px 10px;border-radius:8px;
                     font-family:inherit;resize:vertical;}
  .intent-form textarea{min-height:64px;}
  .intent-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){.intent-row{grid-template-columns:1fr;}}
  .intent-help{font-size:10.5px;color:var(--text-muted);margin-top:-2px;}
  /* ---------------- estate scan & report (step 01) ---------------- */
  .disc-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:0 0 18px;overflow-x:auto;}
  .disc-tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;margin-bottom:-1px;
            font:inherit;font-size:13.5px;color:var(--text-muted);cursor:pointer;white-space:nowrap;}
  .disc-tab:hover{color:var(--text-primary);}
  .disc-tab.on{color:var(--text-primary);font-weight:600;border-bottom-color:var(--accent);}
  .scan-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .scan-status{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .scan-status b{color:var(--text-primary);font-weight:600;}
  .scan-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
  .scan-depth{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);}
  .scan-depth select{background:var(--bg-panel);border:1px solid var(--border);border-radius:7px;
                     padding:6px 9px;font:inherit;font-size:12.5px;color:var(--text-primary);}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);
        animation:spin .8s linear infinite;flex:none;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none;}}

  .e-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .e-tile{background:var(--bg-panel);border:1px solid var(--border);border-radius:11px;padding:14px 15px;}
  .e-tile .lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px;}
  .e-tile .val{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .e-tile .ft{font-size:11.5px;color:var(--text-muted);margin-top:6px;}

  .e-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start;}
  @media (max-width:980px){.e-grid{grid-template-columns:1fr;}}

  .tier-row{display:grid;grid-template-columns:22px minmax(0,1fr) 100px;gap:12px;align-items:center;
            padding:11px 0;border-bottom:1px solid var(--border-soft);}
  .tier-row:last-child{border-bottom:none;padding-bottom:0;}
  .tier-row .tn{font-family:'IBM Plex Mono';font-size:11px;color:var(--text-muted);}
  .tier-row .tt{font-size:13.5px;font-weight:500;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .tier-row .tbar{height:6px;background:var(--bg-raised);border-radius:3px;overflow:hidden;}
  .tier-row .tbar i{display:block;height:100%;border-radius:3px;background:var(--silver);}
  .tier-row .tbar i.agent{background:var(--accent);}
  .tier-row .tbar i.off{background:transparent;}
  .tier-row .tv{text-align:right;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-muted);}
  .tier-row .tv b{display:block;color:var(--text-primary);font-size:13px;font-weight:600;}
  .tier-row.skipped{opacity:.5;}
  .kind{font-family:'IBM Plex Mono';font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
        padding:2px 7px;border-radius:5px;background:var(--bg-raised);color:var(--text-secondary);}
  .kind.agent{background:var(--accent-soft);color:var(--accent-ink);}

  .q-item{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:11px 0;
          border-bottom:1px solid var(--border-soft);align-items:start;}
  .q-item:last-child{border-bottom:none;padding-bottom:0;}
  .q-item .qt{font-size:13px;color:var(--text-secondary);line-height:1.5;}
  .q-item .qt code{font-family:'IBM Plex Mono';font-size:11.5px;background:var(--bg-panel-2);
                   border:1px solid var(--border-soft);border-radius:4px;padding:0 4px;color:var(--text-primary);}
  .sev{font-family:'IBM Plex Mono';font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
       padding:3px 7px;border-radius:5px;text-align:center;}
  .sev.high{background:var(--critical-soft);color:var(--critical);}
  .sev.medium{background:var(--warning-soft);color:var(--warning);}
  .sev.low{background:var(--bg-raised);color:var(--text-secondary);}
  .q-kind{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}

  /* review loop: versions, diffs, sign-off */
  .rv-status{font-family:'IBM Plex Mono';font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .rv-status.pending{background:var(--warning-soft);color:var(--warning);}
  .rv-status.accepted,.rv-status.signed{background:var(--good-soft);color:var(--good);}
  .rv-status.rejected{background:var(--critical-soft);color:var(--critical);}
  .rv-ver{font-family:'IBM Plex Mono';font-size:11px;color:var(--text-muted);}
  .rv-actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
  .btn.sm{padding:4px 9px;font-size:11px;}
  .rv-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .rv-head h3{margin:0;}
  .rv-grid{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:20px;margin-top:14px;}
  @media (max-width:760px){.rv-grid{grid-template-columns:1fr;}}
  .rv-hist{display:flex;flex-direction:column;gap:6px;}
  .rv-hist button{text-align:left;background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:9px;
    padding:8px 10px;cursor:pointer;font:inherit;color:var(--text-secondary);display:flex;flex-direction:column;gap:3px;}
  .rv-hist button:hover{border-color:var(--border);}
  .rv-hist button.on{border-color:var(--accent-line);background:var(--accent-soft);}
  .rv-hist button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .rv-hist .h1{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-primary);font-weight:600;}
  .rv-hist .h2{font-size:10.5px;color:var(--text-muted);line-height:1.45;overflow-wrap:anywhere;}
  .rv-hist-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .rv-hist-row button{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:20px;padding:3px 9px;
    font-family:'IBM Plex Mono';font-size:10.5px;color:var(--text-secondary);cursor:pointer;display:inline-flex;gap:5px;align-items:center;}
  .rv-hist-row button.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink);}
  .rv-sec{margin-bottom:16px;}
  .rv-sec h4{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:0 0 6px;font-weight:600;}
  .rv-change{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:3px 0;color:var(--text-secondary);}
  .rv-change .tag{font-family:'IBM Plex Mono';font-size:10px;min-width:74px;flex-shrink:0;color:var(--text-muted);}
  .rv-change .tag.add{color:var(--good);}
  .rv-change .tag.del{color:var(--critical);}
  .rv-change .tag.mod{color:var(--warning);}
  .rv-change code{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-primary);}
  .rv-preview{overflow-x:auto;border:1px solid var(--border-soft);border-radius:9px;background:var(--bg-panel);}
  .rv-preview table{border-collapse:collapse;font-family:'IBM Plex Mono';font-size:11px;min-width:100%;}
  .rv-preview th,.rv-preview td{padding:5px 9px;border-bottom:1px solid var(--border-soft);white-space:nowrap;text-align:left;}
  .rv-preview tr:last-child td{border-bottom:none;}
  .rv-preview th{background:var(--bg-panel-2);color:var(--text-muted);font-weight:600;position:sticky;top:0;}
  .rv-preview td.null{color:var(--text-muted);font-style:italic;}
  .rv-decide{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border-soft);padding-top:12px;margin-top:4px;}
  .rv-decide input{flex:1;min-width:200px;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:8px;
    padding:7px 10px;font:inherit;font-size:12px;color:var(--text-primary);}
  .rv-note{font-size:12px;color:var(--text-muted);line-height:1.5;}
  .rv-signed{font-size:12px;color:var(--text-secondary);}
  .est-table-wrap{overflow-x:auto;}
  .est-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
  .est-table th{text-align:left;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;
                color:var(--text-muted);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .est-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text-secondary);vertical-align:top;}
  .est-table tr:last-child td{border-bottom:none;}
  .est-table .mono{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-primary);}
  .est-table .num{font-family:'IBM Plex Mono';text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .integ{font-family:'IBM Plex Mono';font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
         padding:2px 7px;border-radius:5px;white-space:nowrap;}
  .integ.intact{background:var(--good-soft);color:var(--good);}
  .integ.orphans{background:var(--warning-soft);color:var(--warning);}
  .integ.weak{background:var(--critical-soft);color:var(--critical);}
  .integ.identical{background:var(--bg-raised);color:var(--text-secondary);}
  .integ.diverged{background:var(--critical-soft);color:var(--critical);}
  .integ.ready{background:var(--good-soft);color:var(--good);}
  .integ.quality{background:var(--warning-soft);color:var(--warning);}
  .integ.missing{background:var(--critical-soft);color:var(--critical);}
  .sens-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;margin:0 6px 6px 0;
             background:var(--warning-soft);color:var(--warning);font-size:12px;font-weight:600;}
  .sens-chip b{font-family:'IBM Plex Mono';}
  .ent-row{padding:11px 0;border-bottom:1px solid var(--border-soft);}
  .ent-row:last-child{border-bottom:none;padding-bottom:0;}
  .ent-row .eh{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:4px;}
  .ent-row .en{font-family:'IBM Plex Mono';font-size:12px;color:var(--text-primary);font-weight:600;}
  .ent-row .em{font-size:12.5px;color:var(--text-secondary);}
  .ent-row .ec{font-size:12px;color:var(--warning);margin-top:4px;}
  .note-line{font-size:12px;color:var(--text-muted);margin:10px 0 0;}

  .mem-card{border:1px solid var(--border-soft);border-radius:10px;padding:11px 14px;background:var(--bg-panel-2);margin-bottom:8px;
           display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .mem-card:last-child{margin-bottom:0;}
  .mem-agent{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:4px;}
  .mem-subject{font-weight:600;font-size:13px;color:var(--text-primary);margin-bottom:3px;}
  .mem-content{font-size:11.5px;color:var(--text-secondary);font-family:'IBM Plex Mono';white-space:pre-wrap;word-break:break-word;}
  .mem-meta{font-size:10px;color:var(--text-muted);margin-top:5px;}
  .mem-del{flex:none;background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;
          width:26px;height:26px;cursor:pointer;font-size:12px;}
  .mem-del:hover{border-color:var(--critical);color:var(--critical);}
  .chat-wrap{display:flex;flex-direction:column;gap:10px;}
  .chat-log{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px;}
  .chat-log:empty::after{content:'Say hello to get started.';color:var(--text-muted);font-size:12.5px;}
  .chat-bubble{max-width:82%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;}
  .chat-bubble.user{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--text-primary);}
  .chat-bubble.assistant{align-self:flex-start;background:var(--bg-panel-2);border:1px solid var(--border-soft);color:var(--text-secondary);}
  .chat-suggestion{align-self:flex-start;max-width:92%;background:var(--gold-soft);border:1px solid var(--gold-line);
                   border-radius:12px;padding:11px 13px;}
  .chat-suggestion pre{margin:0 0 9px;font-size:11px;font-family:'IBM Plex Mono';color:var(--text-secondary);
                       white-space:pre-wrap;max-height:180px;overflow-y:auto;}
  .chat-input-row{display:flex;gap:8px;align-items:flex-end;}
  .chat-input-row textarea{flex:1;min-height:40px;max-height:100px;background:var(--bg-panel-2);border:1px solid var(--border);
                           border-radius:8px;color:var(--text-primary);padding:9px 11px;font-family:inherit;font-size:13px;resize:vertical;}
  .chat-mic{flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--bg-panel-2);
           color:var(--text-secondary);cursor:pointer;font-size:15px;}
  .chat-mic.recording{background:var(--critical-soft);border-color:var(--critical);color:var(--critical);animation:blink 1.2s infinite;}
  .diagram-tabs{display:flex;gap:8px;}
  .diagram-tabs .btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text-primary);}
  .diagram-svg-wrap{overflow-x:auto;background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:14px;}
  .ll-card{border:1px solid var(--border-soft);border-radius:10px;padding:13px 15px;background:var(--bg-panel-2);margin-bottom:10px;}
  .ll-card:last-child{margin-bottom:0;}
  .ll-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .ll-kind{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:20px;}
  .ll-kind.dimension{background:var(--violet-soft);color:#9B7FE8;}
  .ll-kind.fact{background:var(--bronze-soft);color:var(--warning);}
  .ll-name{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;}
  .ll-cols{font-size:11.5px;color:var(--text-secondary);font-family:'IBM Plex Mono';display:flex;flex-wrap:wrap;gap:6px 16px;}
  .ll-fk{margin-top:8px;font-size:11px;color:var(--text-muted);}
  .ll-fk b{color:var(--accent);font-family:'IBM Plex Mono';}
  .intent-tabs{display:flex;flex-wrap:wrap;gap:8px;}
  .intent-tab{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:20px;
             background:var(--bg-panel-2);border:1px solid var(--border);cursor:pointer;
             font-size:12px;color:var(--text-secondary);}
  .intent-tab:hover{border-color:var(--accent);}
  .intent-tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text-primary);font-weight:600;}
  .intent-tab .gap-dot{width:6px;height:6px;border-radius:50%;background:var(--critical);}
  .gap-row{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:6px;}
  .gap-row.resolved{background:var(--good-soft);}
  .gap-row.open{background:var(--critical-soft);}
  .gap-row .gst{font-family:'IBM Plex Mono';font-size:10px;font-weight:600;text-transform:uppercase;width:60px;flex:none;}
  .gap-row.resolved .gst{color:var(--good);}
  .gap-row.open .gst{color:var(--critical);}
  .gap-row .gname{color:var(--text-primary);font-weight:600;font-family:'IBM Plex Mono';}
  .gap-row .gwhere{color:var(--text-muted);font-size:11px;}
  .conflict-row{padding:9px 11px;border-radius:8px;background:var(--critical-soft);margin-bottom:8px;font-size:12px;}
  .conflict-row .term{font-weight:600;color:var(--text-primary);}
  .conflict-row ul{margin:5px 0 0;padding-left:18px;color:var(--text-secondary);}

  .issue-row{display:flex;gap:10px;align-items:baseline;padding:9px 11px;border-radius:8px;
             background:var(--critical-soft);margin-bottom:6px;font-size:12px;}
  .issue-row .ikind{font-family:'IBM Plex Mono';font-size:10px;color:var(--critical);text-transform:uppercase;
                    flex:none;width:120px;}
  .issue-row .idetail{color:var(--text-secondary);}

  /* ---------------- test pack (step 04) ---------------- */
  .tp-layer{margin-bottom:16px;}
  .tp-layer:last-child{margin-bottom:0;}
  .tp-layer-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .tp-layer-head h4{font-family:'IBM Plex Sans';font-size:13.5px;font-weight:700;text-transform:capitalize;}
  .tp-layer-count{font-family:'IBM Plex Mono';font-size:11px;color:var(--text-muted);}
  .tp-case{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px 10px;border-radius:8px;
           font-size:12px;margin-bottom:4px;}
  .tp-case.pass{background:var(--good-soft);}
  .tp-case.fail{background:var(--critical-soft);}
  .tp-case .tst{font-family:'IBM Plex Mono';font-size:10px;font-weight:600;text-transform:uppercase;}
  .tp-case.pass .tst{color:var(--good);}
  .tp-case.fail .tst{color:var(--critical);}
  .tp-case .tdesc{color:var(--text-primary);font-weight:600;font-family:'IBM Plex Mono';font-size:11px;}
  .tp-case .tdetail{color:var(--text-muted);margin-left:8px;font-weight:400;}

  /* ---------------- dashboard / visualisation (agent 6) ---------------- */
  :root{
    /* Dark categorical steps, validated against this app's own chart surface
       (--bg-panel-2) via the dataviz skill's validator -- all 5 checks pass. Fixed order,
       never cycled arbitrarily. */
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --series-4:#c98500; --series-5:#d55181; --series-6:#008300;
  }
  .dash-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .dash-badge{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
             padding:3px 9px;border-radius:20px;}
  .dash-badge.proposed{background:var(--gold-soft);color:var(--gold);}
  .dash-badge.saved{background:var(--good-soft);color:var(--good);}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;}
  .dash-tile{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:14px;
            padding:16px 17px;display:flex;flex-direction:column;gap:4px;}
  .dash-tile.tile-kpi{justify-content:center;}
  .dash-tile.tile-table{grid-column:1/-1;}
  .dash-tile-title{font-family:'IBM Plex Sans';font-size:12.5px;font-weight:700;color:var(--text-primary);}
  .dash-tile-sub{font-size:10.5px;color:var(--text-muted);margin-bottom:6px;}
  .dash-tile-error{font-size:11.5px;color:var(--critical);padding:8px 0;}
  .kpi-value{font-family:'IBM Plex Mono';font-size:32px;font-weight:600;color:var(--text-primary);
            line-height:1.2;}
  .kpi-label{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}

  .barchart{position:relative;}
  .barchart svg{width:100%;height:auto;overflow:visible;}
  .bc-bar{cursor:pointer;}
  .bc-axis-label{font-family:'IBM Plex Mono';font-size:9px;fill:var(--text-muted);}
  .bc-value-label{font-family:'IBM Plex Mono';font-size:9px;fill:var(--text-secondary);}
  .bc-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .bc-legend-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-secondary);}
  .bc-legend-swatch{width:9px;height:9px;border-radius:2px;flex:none;}
  .bc-tooltip{position:fixed;pointer-events:none;background:var(--bg-raised);border:1px solid var(--border);
             border-radius:8px;padding:7px 10px;font-size:11px;color:var(--text-primary);z-index:200;
             box-shadow:var(--shadow);display:none;font-family:'IBM Plex Mono';white-space:nowrap;}
  .bc-tooltip b{color:var(--accent);}

  .dash-table{width:100%;border-collapse:collapse;font-size:12px;}
  .dash-table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;
                 color:var(--text-muted);padding:7px 9px;border-bottom:1px solid var(--border-soft);}
  .dash-table td{padding:7px 9px;border-bottom:1px solid var(--border-soft);color:var(--text-secondary);
                 font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums;}
  .dash-table tr:last-child td{border-bottom:none;}
  .dash-table td:first-child{color:var(--text-primary);font-weight:600;}

  /* ---------------- ops tickets (step 05, agent 7) ---------------- */
  .ticket-card{border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;
              background:var(--bg-panel-2);margin-bottom:10px;}
  .ticket-card:last-child{margin-bottom:0;}
  .ticket-top{display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
  .ticket-id{font-family:'IBM Plex Mono';font-size:12px;font-weight:600;color:var(--text-muted);}
  .ticket-entity{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--text-primary);font-weight:600;}
  .ticket-status{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
                padding:4px 10px;border-radius:20px;flex:none;}
  .ticket-status.open{background:var(--critical-soft);color:var(--critical);}
  .ticket-status.assigned{background:var(--warning-soft);color:var(--warning);}
  .ticket-status.fix_pending_approval{background:var(--gold-soft);color:var(--gold);animation:blink 1.6s infinite;}
  .ticket-status.resolved{background:var(--good-soft);color:var(--good);}
  .ticket-status.rejected{background:var(--muted-soft);color:var(--text-muted);}
  .ticket-desc{font-size:12.5px;color:var(--text-secondary);margin-top:8px;}
  .ticket-meta{font-size:10.5px;color:var(--text-muted);margin-top:6px;font-family:'IBM Plex Mono';}
  .ticket-actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center;}
  .ticket-actions input{background:var(--bg-raised);border:1px solid var(--border);color:var(--text-primary);
                        font-size:11.5px;padding:6px 9px;border-radius:7px;font-family:inherit;min-width:160px;}
  .footnote{font-size:11.5px;color:var(--text-muted);line-height:1.6;padding-top:6px;}
  .footnote b{color:var(--text-secondary);}

  /* ---------------- login ---------------- */
  .login-overlay{position:fixed;inset:0;background:rgba(13,27,42,.34);backdrop-filter:blur(3px);
                 display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .login-overlay.show{display:flex;}
  .login-card{width:100%;max-width:340px;background:var(--bg-panel);border:1px solid var(--border);
              border-radius:16px;padding:28px 26px;box-shadow:var(--shadow);}
  .login-card h2{font-size:16px;margin-bottom:4px;}
  .login-card .sub{font-size:12px;color:var(--text-muted);margin-bottom:18px;}
  .login-card input{width:100%;background:var(--bg-panel-2);border:1px solid var(--border);
                    color:var(--text-primary);font-size:13px;padding:9px 11px;border-radius:8px;
                    font-family:inherit;margin-bottom:10px;}
  .login-card .err{font-size:11.5px;color:var(--critical);min-height:16px;margin-bottom:6px;}
  .login-card button{width:100%;padding:9px;margin-top:2px;}

  @media (max-width:860px){
    .shell{grid-template-columns:1fr;}
    .rail{position:static;border-right:none;border-bottom:1px solid var(--border-soft);
          flex-direction:row;overflow-x:auto;padding:12px;gap:8px;}
    .rail-title{display:none;}
    .step-btn{min-width:186px;flex:none;}
    .stage{padding:20px 16px 60px;}
  }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <form class="login-card" id="loginForm">
    <h2>Foundation First</h2>
    <div class="sub">Sign in to view live pipeline &amp; agent-run data.</div>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="username" required>
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
</div>

<div class="topbar">
  <div class="brand">
    <!-- Three strata, widest at the base: a foundation, and the medallion layers it's built
         from. Reads as both at a glance, which is the whole product in one mark. -->
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="3" y="21" width="26" height="6.5" rx="1.6" fill="var(--bronze)"/>
      <rect x="6.5" y="12.2" width="19" height="6.5" rx="1.6" fill="var(--silver)"/>
      <rect x="10" y="3.5" width="12" height="6.5" rx="1.6" fill="var(--gold)"/>
    </svg>
    <div class="brand-text">
      <h1>Foundation First</h1>
      <div class="sub">Know the ground before you build on it</div>
    </div>
  </div>
  <div class="header-right">
    <div class="user-badge" id="userBadge" style="display:none;"></div>
    <div class="live-badge"><span class="dot"></span>Live</div>
    <select id="domain"></select>
    <select id="target"></select>
    <div class="conn-pills" id="connPills"></div>
    <button class="btn ghost" id="logoutBtn" style="display:none;" onclick="doLogout()">Sign out</button>
  </div>
</div>

<div class="shell">
  <nav class="rail" id="rail"><div class="rail-title">The journey</div></nav>
  <main class="stage">
    <div id="attention"></div>
    <div id="screen"><div class="empty-note">Loading…</div></div>
  </main>
</div>

<input type="file" id="fileInput" accept=".xlsx">

<script>
/* ============================== helpers ============================== */
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtNum(n){ return (n||0).toLocaleString(); }
function timeAgo(iso){
  if(!iso) return "no runs yet";
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60)+"m ago";
  if (s < 86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

let currentTarget = "duckdb";
let currentDomain = "insurance";
let currentStep   = 1;          // land on Discovery: knowing the estate is the product's first real value
let currentDiscoveryTab = 'estate';   // survives re-renders: reloadJourney() rebuilds the whole screen
let journeyData   = null;
let pendingRuns   = [];

/* ============================== API base + auth ============================== */
// Same file serves two ways: the FastAPI backend hands it out directly at "/" (same-origin --
// API_BASE stays "" and every call is relative), or it's deployed standalone to Vercel, where
// every request must go cross-origin to Railway. Detected by host so one file works from both.
const RAILWAY_BACKEND = "https://jarvis-backend-production-dfb3.up.railway.app";
const API_BASE = (["localhost", "127.0.0.1"].includes(location.hostname) || location.hostname.endsWith(".up.railway.app"))
  ? "" : RAILWAY_BACKEND;

function getCred(){ try { return sessionStorage.getItem('jarvis_cred'); } catch { return null; } }
function setCred(c){ try { sessionStorage.setItem('jarvis_cred', c); } catch {} }
function clearCred(){ try { sessionStorage.removeItem('jarvis_cred'); } catch {} }

async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers || {});
  const cred = getCred();
  if (cred) headers['Authorization'] = 'Basic ' + cred;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, {headers}));
  if (res.status === 401) { clearCred(); await showLogin(); return api(path, opts); }
  return res;
}

function showLogin(){
  return new Promise(resolve => {
    const overlay = document.getElementById('loginOverlay');
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    overlay.classList.add('show');
    form.onsubmit = async (e) => {
      e.preventDefault();
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;
      const cred = btoa(`${u}:${p}`);
      try {
        const r = await fetch(API_BASE + '/api/targets', {headers: {Authorization: 'Basic ' + cred}});
        if (r.ok) { setCred(cred); overlay.classList.remove('show'); resolve(); }
        else errEl.textContent = 'Invalid username or password.';
      } catch { errEl.textContent = 'Could not reach the backend.'; }
    };
  });
}

/* ============================== who's logged in ============================== */
let currentUserDomains = "*";

function doLogout(){
  clearCred();
  location.reload();
}
window.doLogout = doLogout;

async function loadMe(){
  try {
    const r = await api('/api/me');
    const j = await r.json();
    currentUserDomains = j.domains;
    const badge = document.getElementById('userBadge');
    const logoutBtn = document.getElementById('logoutBtn');
    if (j.username) {
      const scope = j.domains === '*' ? 'all domains' : (j.domains || []).join(', ');
      badge.innerHTML = `${esc(j.label)} <span class="scope">· ${esc(scope)}</span>`;
      badge.style.display = 'flex';
      logoutBtn.style.display = 'inline-flex';
    }
  } catch { /* /api/me not reachable yet (e.g. local dev with no auth) -- harmless */ }
}

/* ============================== selectors ============================== */
async function loadTargets(){
  const r = await api('/api/targets'); const j = await r.json();
  const sel = document.getElementById('target');
  sel.innerHTML = j.targets.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  if (j.targets.includes('duckdb')) sel.value = 'duckdb';
  currentTarget = sel.value;
  sel.addEventListener('change', () => { currentTarget = sel.value; reloadJourney(); });
}

async function loadDomains(){
  const r = await api('/api/domains'); const j = await r.json();
  const sel = document.getElementById('domain');
  sel.innerHTML = j.domains.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  if (j.domains.includes('insurance')) sel.value = 'insurance';
  currentDomain = sel.value;
  // A scoped company login (server already filtered /api/domains to what it may see) has
  // nothing to switch between -- lock the selector instead of showing a live-looking dropdown
  // with one dead-end option.
  sel.disabled = j.domains.length <= 1;
  sel.addEventListener('change', () => {
    currentDomain = sel.value;
    if (typeof chatState !== 'undefined') { chatState.intent.history = []; chatState.architecture.history = []; }
    reloadJourney();
  });
}

/* ============================== journey + rail ============================== */
async function reloadJourney(){
  const pills = document.getElementById('connPills');
  try {
    const r = await api(`/api/journey?domain=${encodeURIComponent(currentDomain)}&target=${encodeURIComponent(currentTarget)}`);
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    journeyData = await r.json();
    pills.innerHTML = `<div class="pill"><span class="dot"></span>${esc(currentTarget)}</div>`;
  } catch (e) {
    pills.innerHTML = `<div class="pill err"><span class="dot"></span>${esc(currentTarget)} unreachable</div>`;
    document.getElementById('screen').innerHTML = `<div class="empty-note">Could not load the journey: ${esc(e.message)}</div>`;
    return;
  }
  renderRail();
  renderScreen();
}

function gateStateFor(gate){
  if (pendingRuns.some(r => r.pending_action && r.pending_action.gate && r.pending_action.gate.id === gate.id)) return 'pending';
  if (gate.capability === 'planned') return 'planned';
  if (gate.passed) return 'passed';
  return 'waiting';
}

function renderRail(){
  const rail = document.getElementById('rail');
  let html = `<div class="rail-title">The journey</div>`;
  journeyData.steps.forEach(s => {
    const gates = (s.gates || []).map(g => {
      const st = gateStateFor(g);
      return `<span class="gbadge ${st === 'pending' ? 'pending' : (st === 'passed' ? 'passed' : '')}">${esc(g.id)}</span>`;
    }).join('');
    html += `<button class="step-btn ${s.step === currentStep ? 'sel' : ''}" onclick="selectStep(${s.step})">
      <span class="sn">${String(s.step).padStart(2,'0')}</span>
      <span>
        <span class="sname">${esc(s.name)}</span>
        <span class="smeta"><span class="cap ${esc(s.capability)}">${esc(s.capability)}</span>${gates}</span>
      </span>
    </button>`;
  });
  rail.innerHTML = html;
}

function selectStep(n){ currentStep = n; renderRail(); renderScreen(); }
window.selectStep = selectStep;

async function refreshJourneyDataQuietly(){
  // Same fetch as reloadJourney(), but only updates the rail's badges -- never touches
  // #screen, so it's safe to call after an in-place action (profiling a source, a gate
  // resuming) without discarding whatever the user is mid-way through on the current screen.
  try {
    const r = await api(`/api/journey?domain=${encodeURIComponent(currentDomain)}&target=${encodeURIComponent(currentTarget)}`);
    if (r.ok) { journeyData = await r.json(); renderRail(); }
  } catch {}
}

/* ============================== attention bar ============================== */
function renderAttention(){
  const el = document.getElementById('attention');
  const awaiting = pendingRuns.filter(r => r.status === 'awaiting_approval');
  if (!awaiting.length) { el.innerHTML = ''; return; }
  el.innerHTML = awaiting.map(run => {
    const g = run.pending_action && run.pending_action.gate;
    const label = g ? `${g.id} · ${g.name}` : 'Approval needed';
    const what = g ? g.approves : 'The agent is paused waiting for a decision.';
    const step = g ? g.step : null;
    return `<div class="attn">
      <span class="lbl">⏸ Paused · ${esc(label)}</span>
      <span class="tx"><b>${esc(run.domain)}</b> — ${esc(what)}</span>
      ${step !== null ? `<button class="btn ghost" onclick="selectStep(${step})">Open step ${String(step).padStart(2,'0')}</button>` : ''}
      <button class="btn primary" onclick="approveRun('${esc(run.run_id)}')">Approve</button>
      <button class="btn reject" onclick="rejectRun('${esc(run.run_id)}')">Reject</button>
    </div>`;
  }).join('');
}

/* ============================== gate cards ============================== */
function gateCard(gate){
  const state = gateStateFor(gate);
  const run = pendingRuns.find(r => r.pending_action && r.pending_action.gate && r.pending_action.gate.id === gate.id);
  const stateLabel = {pending:'Awaiting you', passed:'Passed', waiting:'Not reached', planned:'Not built yet'}[state];
  let args = '';
  if (run) {
    const reqs = (run.pending_action.action_requests || []);
    args = reqs.map(r => `<div class="gargs">${esc(r.name)}(${esc(JSON.stringify(r.args, null, 1))})</div>`).join('');
  }
  const recs = (gate.records || []).map(r =>
    `<div class="grec">✓ signed ${esc((r.date||'').slice(0,19))} · ${esc(r.file)}</div>`).join('');
  return `<div class="gate ${state}">
    <div class="gate-top">
      <span class="gid">${esc(gate.id)}</span>
      <span class="gname">${esc(gate.name)}</span>
      <span class="gstate ${state}">${esc(stateLabel)}</span>
    </div>
    <div class="gapproves">${esc(gate.approves)}</div>
    ${gate.rule ? `<div class="grule">${esc(gate.rule)}</div>` : ''}
    ${gate.blocked_by ? `<div class="grule">Blocked by: ${esc(gate.blocked_by)}</div>` : ''}
    ${gate.tool ? `<div class="grule mono">interrupts on: ${esc(gate.tool)}${gate.prep ? ` · evidence from: ${esc(gate.prep)}` : ''}</div>` : ''}
    ${recs}${args}
    ${run ? `<div class="gate-actions">
        <button class="btn primary" onclick="approveRun('${esc(run.run_id)}')">Approve</button>
        <button class="btn reject" onclick="rejectRun('${esc(run.run_id)}')">Reject</button>
      </div>` : ''}
  </div>`;
}

/* ============================== screens ============================== */
function screenHead(s){
  const who = (s.agent_detail || []).map(a =>
    `<span class="who" style="--c:${esc(a.colour)}"><i></i><b>${esc(a.persona || 'Agent ' + a.num)}</b> · ${esc(a.role)}</span>`).join('');
  return `<div class="screen-head">
    <div class="eyebrow">Step ${String(s.step).padStart(2,'0')} · ${esc(s.capability)}</div>
    <h2>${esc(s.name)}</h2>
    <div class="tagline">${esc(s.tagline)}</div>
    ${who ? `<div class="who-row">${who}</div>` : ''}
  </div>`;
}
function gapNote(s){
  if (!s.gap) return '';
  return `<div class="gap"><span class="ic">○</span><span class="tx"><b>Not built yet:</b> ${esc(s.gap)}</span></div>`;
}
function gatesBlock(s){
  if (!s.gates || !s.gates.length) return '';
  return `<div class="panel">
    <div class="panel-head"><h3>Human gate${s.gates.length>1?'s':''}</h3>
      <span class="note">A real pause in the agent graph — the run stops here and only a person resumes it</span></div>
    <div id="gateHost">${s.gates.map(gateCard).join('')}</div></div>`;
}

function refreshGatesInPlace(){
  // Only the gate cards change when a run pauses or resumes -- re-rendering the whole screen
  // would also wipe the upload list mid-interaction, and (since the build screen's renderer
  // calls loadAgentRuns itself) would recurse the moment a step had both gates and runs.
  const host = document.getElementById('gateHost');
  if (!host || !journeyData) return;
  const s = journeyData.steps.find(x => x.step === currentStep);
  if (s && s.gates && s.gates.length) host.innerHTML = s.gates.map(gateCard).join('');
}

function renderScreen(){
  // A scoped company login doesn't get the Workspace step at all (the backend omits it), so a
  // remembered step number can point at a step this account can't see -- fall back to the first
  // one it actually has rather than throwing on an undefined.
  let s = journeyData.steps.find(x => x.step === currentStep);
  if (!s) { s = journeyData.steps[0]; if (!s) return; currentStep = s.step; }
  const el = document.getElementById('screen');
  const o = s.observed || {};
  let body = '';

  if (s.id === 'onboard') {
    body = `<div class="panel">
      <div class="panel-head"><h3>Workspace</h3><span class="note">Domains with compiled contracts on this platform</span></div>
      <div class="stats">
        <div class="stat"><b>${fmtNum((o.domains||[]).length)}</b><span>domains</span></div>
        <div class="stat"><b style="font-size:14px;line-height:1.9">${esc(o.current||'—')}</b><span>current</span></div>
      </div>
      <div class="srclist" style="margin-top:14px;">${(o.domains||[]).map(d=>`<span class="tchip">${esc(d)}</span>`).join('')}</div>
    </div>`;
  }

  else if (s.id === 'sources') {
    const src = o.contracted_sources || [];
    const disc = o.discovery_detail || [];
    const tab = currentDiscoveryTab;
    body = `<div class="disc-tabs" role="tablist">
      <button type="button" class="disc-tab ${tab==='estate'?'on':''}" onclick="switchDiscTab('estate')">Estate</button>
      <button type="button" class="disc-tab ${tab==='findings'?'on':''}" onclick="switchDiscTab('findings')">Findings</button>
      <button type="button" class="disc-tab ${tab==='connect'?'on':''}" onclick="switchDiscTab('connect')">Connect a source</button>
    </div>
    <div data-disc="estate" ${tab==='estate'?'':'hidden'}>
      <div class="panel">
        <div class="panel-head"><h3>Estate scan</h3>
          <span class="note">Mechanical tiers cover everything · the agent reads only the shortlist</span></div>
        <div class="scan-bar">
          <div id="scanStatus" class="scan-status"><span class="empty-note" style="padding:0;">Loading…</span></div>
          <div class="scan-actions">
            <label class="scan-depth" for="scanTiers">Depth
              <select id="scanTiers">
                <option value="4">All 4 tiers (with agent)</option>
                <option value="3">Tiers 1–3 (mechanical)</option>
                <option value="1">Tier 1 only (census)</option>
              </select>
            </label>
            <button type="button" class="btn primary" id="scanBtn" onclick="startEstateScan()">Run scan</button>
          </div>
        </div>
      </div>
      <div id="estateOverview"></div>
    </div>
    <div data-disc="findings" ${tab==='findings'?'':'hidden'}>
      <div id="estateFindings"><div class="empty-note">Loading…</div></div>
    </div>
    <div data-disc="connect" ${tab==='connect'?'':'hidden'}>
    <div class="panel">
      <div class="panel-head"><h3>Discovery status</h3>
        <span class="note">contracts/sources/${esc(currentDomain)}/ vs. contracts/discovery/${esc(currentDomain)}/</span></div>
      <div class="stats">
        <div class="stat"><b>${fmtNum(src.length)}</b><span>under contract</span></div>
        <div class="stat"><b>${fmtNum(disc.length)}</b><span>profiled</span></div>
        <div class="stat"><b>${fmtNum(disc.filter(d => d.review_status === 'accepted').length)}</b><span>accepted</span></div>
        <div class="stat ${disc.some(d => d.review_status === 'pending') ? '' : 'muted'}"><b>${fmtNum(disc.filter(d => d.review_status === 'pending').length)}</b><span>awaiting review</span></div>
      </div>
    </div>
    <div class="panel" id="uploadPanel">
      <div class="panel-head"><h3>Upload a file</h3>
        <span class="note">CSV, TSV, TXT or MD · a new file for an existing source becomes its next version, compared with the last</span></div>
      <div class="conn-form">
        <label>Source id<input id="upSourceId" list="upSourceIds" placeholder="e.g. claims_extract" autocomplete="off"></label>
        <datalist id="upSourceIds">${disc.map(d => `<option value="${esc(d.source_id)}"></option>`).join('')}</datalist>
        <label>File<input id="upFile" type="file" accept=".csv,.tsv,.txt,.md"></label>
        <label>What changed? (optional)<input id="upNote" placeholder="e.g. corrected March extract"></label>
      </div>
      <div class="conn-actions"><button class="btn primary" id="upBtn" onclick="uploadSourceFile()">Upload and profile</button></div>
      <div id="upResult"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Connect to a source</h3>
        <span class="note">Real connectors — file, database (Databricks), API. Test first, then sample it.</span></div>
      <div class="conn-form">
        <label>Type
          <select id="connType" onchange="renderConnFields()">
            <option value="file">File (landing zone)</option>
            <option value="database">Database (Databricks)</option>
            <option value="api">API</option>
            <option value="unstructured">Unstructured files</option>
          </select>
        </label>
        <label>Candidate source id<input id="connSourceId" placeholder="e.g. claims_extract"></label>
        <label>Sample limit<input id="connSampleLimit" type="number" value="500"></label>
      </div>
      <div class="conn-form" id="connFields" style="margin-top:11px;"></div>
      <div class="conn-actions">
        <button class="btn ghost" onclick="testConnection()">Test connection</button>
        <button class="btn primary" onclick="profileConnection()">Profile it</button>
      </div>
      <div id="connResult"></div>
    </div>
    <div class="panel" id="reviewPanel" hidden></div>
    <div class="panel">
      <div class="panel-head"><h3>Profiled sources</h3><span class="note">Persisted to contracts/discovery/${esc(currentDomain)}/</span></div>
      <div id="profileList">${disc.length ? '' : '<div class="empty-note">Nothing profiled yet for this domain.</div>'}</div>
    </div>
    </div>`;
  }

  else if (s.id === 'catalogue') {
    const gapBadge = o.gap_open_count === null || o.gap_open_count === undefined
      ? '—' : (o.gap_open_count === 0 ? '✓ 0 open' : `${o.gap_open_count} open`);
    body = `<div class="panel">
      <div class="panel-head"><h3>Catalogue state</h3><span class="note">Compiled contracts on disk for ${esc(currentDomain)}</span></div>
      <div class="stats">
        <div class="stat"><b>${fmtNum(o.source_contracts)}</b><span>source contracts</span></div>
        <div class="stat"><b>${o.model_contract ? '✓' : '—'}</b><span>silver model</span></div>
        <div class="stat"><b>${o.gold_contract ? '✓' : '—'}</b><span>gold model</span></div>
        <div class="stat"><b>${o.intent_captured ? '✓' : '—'}</b><span>intent captured</span></div>
        <div class="stat"><b style="font-size:16px;line-height:2.1;${(o.gap_open_count||0) ? 'color:var(--critical)' : ''}">${gapBadge}</b><span>gap analysis</span></div>
        <div class="stat"><b>${o.architecture_captured ? '✓' : '—'}</b><span>architecture captured</span></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Agent memory</h3>
        <span class="note">What The Delivery Lead and The Chief Architect have actually learned about ${esc(currentDomain)} — never a black box</span></div>
      <div id="memoryList"><div class="empty-note">Loading…</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Intents</h3>

const CONN_FIELD_DEFS = {
  file: [
    {id:'connPath', label:'Path (glob under harness/)', ph:'harness/landing/orders/orders_*.csv'},
    {id:'connDelimiter', label:'Delimiter', ph:',', value:','},
    {id:'connEncoding', label:'Encoding', ph:'utf-8', value:'utf-8'},
    {id:'connHeader', label:'Has header row', checkbox:true, value:true},
  ],
  database: [
    {id:'connTable', label:'Table (catalog.schema.table)', ph:'jarvis.insurance_bronze.addresses'},
  ],
  api: [
    {id:'connEndpoint', label:'Endpoint URL', ph:'https://api.example.com/v1/records'},
  ],
  unstructured: [
    {id:'connPath', label:'Path (glob under harness/)', ph:'harness/landing/docs/*.txt'},
  ],
};

function renderConnFields(){
  const type = document.getElementById('connType').value;
  const host = document.getElementById('connFields');
  host.innerHTML = CONN_FIELD_DEFS[type].map(f => {
    if (f.checkbox) return `<label class="chk"><input type="checkbox" id="${f.id}" ${f.value?'checked':''}> ${esc(f.label)}</label>`;
    return `<label>${esc(f.label)}<input id="${f.id}" placeholder="${esc(f.ph||'')}" value="${esc(f.value||'')}"></label>`;
  }).join('');
}
window.renderConnFields = renderConnFields;

function buildConnection(){
  const type = document.getElementById('connType').value;
  const val = id => { const el = document.getElementById(id); return el ? (el.type === 'checkbox' ? el.checked : el.value) : undefined; };
  if (type === 'file') return {type, path: val('connPath'), format: 'csv', delimiter: val('connDelimiter') || ',',
                                header: val('connHeader') !== false, encoding: val('connEncoding') || 'utf-8'};
  if (type === 'database') return {type, dialect: 'databricks', table: val('connTable')};
  if (type === 'api') return {type, endpoint: val('connEndpoint')};
  if (type === 'unstructured') return {type, path: val('connPath')};
}

async function testConnection(){
  const el = document.getElementById('connResult');
  el.innerHTML = `<div class="conn-result">Testing…</div>`;
  try {
    const r = await api('/api/discovery/test', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({connection: buildConnection(), domain: currentDomain})});
    const j = await r.json();
    el.innerHTML = `<div class="conn-result ${j.ok ? 'ok' : 'bad'}">${j.ok ? '✓' : '✕'} ${esc(j.detail)}</div>`;
  } catch (e) {
    el.innerHTML = `<div class="conn-result bad">✕ ${esc(e.message)}</div>`;
  }
}
window.testConnection = testConnection;

async function profileConnection(){
  const el = document.getElementById('connResult');
  const sourceId = document.getElementById('connSourceId').value.trim();
  if (!sourceId) { el.innerHTML = `<div class="conn-result bad">Give the candidate source an id first.</div>`; return; }
  el.innerHTML = `<div class="conn-result">Sampling…</div>`;
  try {
    const r = await api('/api/discovery/profile', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({connection: buildConnection(), source_id: sourceId, domain: currentDomain,
                             sample_limit: parseInt(document.getElementById('connSampleLimit').value, 10) || 500})});
    const j = await r.json();
    if (!r.ok) { el.innerHTML = `<div class="conn-result bad">✕ ${esc(j.detail || 'profiling failed')}</div>`; return; }
    el.innerHTML = `<div class="conn-result ok">✓ Profiled ${esc(sourceId)} as v${j.version} — ${j.columns.length} columns, ` +
                    `${fmtNum(j.sampled_rows)}/${fmtNum(j.total_rows)} rows sampled. Review it below.</div>`;
    await loadProfiles();
    await openReview(sourceId, j.version);
    await refreshJourneyDataQuietly();   // updates rail badges without rebuilding the screen --
                                          // a full reloadJourney() here would wipe this success
                                          // message and the form the user just filled in
  } catch (e) {
    el.innerHTML = `<div class="conn-result bad">✕ ${esc(e.message)}</div>`;
  }
}
window.profileConnection = profileConnection;

let estatePollTimer = null;

function switchDiscTab(tab){
  currentDiscoveryTab = tab;
  document.querySelectorAll('.disc-tab').forEach(b => b.classList.toggle('on', b.textContent.trim().toLowerCase().startsWith(tab === 'connect' ? 'connect' : tab)));
  document.querySelectorAll('[data-disc]').forEach(p => { p.hidden = p.getAttribute('data-disc') !== tab; });
}
window.switchDiscTab = switchDiscTab;

// Questions arrive with `identifiers` in backticks. Escape first, then promote -- esc() leaves
// backticks alone, so this can't reintroduce markup from the data.
function qText(s){ return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }

function scanStatusHtml(scans, running){
  if (running) {
    return `<span class="spin" aria-hidden="true"></span><b>Scanning ${esc(currentDomain)} on ${esc(currentTarget)}…</b>
      <span>${currentTarget === 'databricks' ? 'Every query is a round trip to the warehouse — this takes a few minutes.' : 'Usually under two minutes with the agent tier.'}</span>`;
  }
  const last = (scans || []).find(s => s.status === 'completed');
  const failed = (scans || [])[0] && scans[0].status === 'failed' ? scans[0] : null;
  if (failed) return `<span class="sev high">failed</span> <span>${esc(failed.note || 'the last scan failed')}</span>`;
  if (!last) return `<span>No scan yet for <b>${esc(currentDomain)}</b> on ${esc(currentTarget)}. Run one to see what's actually in the estate.</span>`;
  return `<span>Last scan <b>${timeAgo(last.ended_at)}</b> · ${fmtNum(last.tables_scanned)} tables across ${fmtNum(last.schemas_scanned)} schemas · reached tier ${last.tier_reached}</span>`;
}

function estateOverviewHtml(r){
  if (!r.scan) return '';
  const c = r.coverage, rel = r.relationships, q = r.open_questions || [];
  const reached = r.scan.tier_reached || 0;
  const edges = rel.intact.length + rel.orphans.length + rel.weak.length;
  const pct = n => c.tables ? Math.max(2, Math.round(100 * n / c.tables)) : 0;
  const high = q.filter(x => x.severity === 'high').length;

  const tier = (n, name, agent, value, sub, width) => {
    const ran = reached >= n;
    return `<div class="tier-row ${ran ? '' : 'skipped'}">
      <span class="tn">0${n}</span>
      <div><div class="tt">${name} <span class="kind ${agent ? 'agent' : ''}">${agent ? 'agent' : 'mechanical'}</span>${ran ? '' : '<span class="kind">not run</span>'}</div>
        <div class="tbar"><i class="${agent ? 'agent' : ''} ${ran ? '' : 'off'}" style="width:${ran ? width : 0}%"></i></div></div>
      <div class="tv"><b>${ran ? value : '—'}</b>${sub}</div>
    </div>`;
  };

  const questions = q.slice(0, 8).map(x => `<div class="q-item">
      <div><span class="sev ${esc(x.severity)}">${esc(x.severity)}</span><span class="q-kind">${esc(x.kind)}</span></div>
      <div class="qt">${qText(x.question)}</div>
    </div>`).join('') || `<div class="empty-note">Nothing open — every finding in this scan was either clean or already resolved.</div>`;

  return `<div class="e-tiles">
      <div class="e-tile"><div class="lab">Schemas</div><div class="val">${fmtNum(c.schemas)}</div>
        <div class="ft">${r.scan.scope === 'domain' ? `${esc(currentDomain)}'s own schemas`
          : c.unclassified_schemas.length ? `${c.unclassified_schemas.length} belong to no domain` : 'all owned by a domain'}</div></div>
      <div class="e-tile"><div class="lab">Tables inventoried</div><div class="val">${fmtNum(c.tables)}</div>
        <div class="ft">${fmtNum(c.columns)} columns · ${fmtNum(c.rows)} rows</div></div>
      <div class="e-tile"><div class="lab">Sensitive columns</div><div class="val" style="color:var(--warning)">${fmtNum(r.sensitivity.total)}</div>
        <div class="ft">candidates, by column name</div></div>
      <div class="e-tile"><div class="lab">Open questions</div><div class="val" style="color:${high ? 'var(--critical)' : 'var(--text-primary)'}">${fmtNum(q.length)}</div>
        <div class="ft">${high} high severity</div></div>
    </div>
    <div class="e-grid">
      <div class="panel" style="margin-bottom:0;">
        <div class="panel-head"><h3>Scan coverage</h3><span class="note">scan ${esc(r.scan.scan_id)}</span></div>
        ${tier(1, 'Inventory sweep', false, fmtNum(c.tables), 'every table', 100)}
        ${tier(2, 'Statistical profile', false, fmtNum(c.profiled_tables), 'shortlisted', pct(c.profiled_tables))}
        ${tier(3, 'Relationships &amp; mirrors', false, fmtNum(edges), 'references found', pct(c.profiled_tables))}
        ${tier(4, 'Semantic enrichment', true, fmtNum(c.enriched_tables), 'tables read', pct(c.enriched_tables))}
        ${r.scan.note ? `<p class="note-line">${esc(r.scan.note)}</p>` : ''}
      </div>
      <div class="panel" style="margin-bottom:0;">
        <div class="panel-head"><h3>Open questions</h3>
          <span class="note">${q.length > 8 ? `top 8 of ${q.length} · ` : ''}each needs a named human</span></div>
        ${questions}
        ${q.length > 8 ? `<p class="note-line"><a href="#" onclick="switchDiscTab('findings');return false;">See all findings →</a></p>` : ''}
      </div>
    </div>`;
}

function estateFindingsHtml(r){
  if (!r.scan) return `<div class="empty-note">No scan yet — run one on the Estate tab.</div>`;
  const rel = r.relationships;
  const refRows = [...rel.weak, ...rel.orphans, ...rel.intact].map(x => `<tr>
      <td class="mono">${esc(x.from_schema)}.${esc(x.from_table)}.${esc(x.from_column)}</td>
      <td class="mono">${esc(x.to_table)}.${esc(x.to_column)}</td>
      <td class="num">${x.overlap_pct}%</td>
      <td><span class="integ ${esc(x.confidence)}">${esc(x.confidence)}</span></td></tr>`).join('');

  const mirrors = [...r.mirrors.diverged.map(m => ({...m, state:'diverged'})), ...r.mirrors.identical.map(m => ({...m, state:'identical'}))];
  const mirrorRows = mirrors.map(m => `<tr>
      <td class="mono">${esc(m.table)}</td><td class="mono">${esc(m.mirrors)}</td>
      <td class="num">${m.state === 'diverged' ? fmtNum(m.differing_rows) + ' rows differ' : fmtNum(m.rows) + ' rows'}</td>
      <td><span class="integ ${m.state}">${m.state}</span></td></tr>`).join('');

  const sens = r.sensitivity.by_class.map(b => `<span class="sens-chip">${esc(b.class)} <b>${b.count}</b></span>`).join('');
  const sensRows = r.sensitivity.by_class.flatMap(b => b.columns.map(col => `<tr><td class="mono">${esc(col)}</td><td>${esc(b.class)}</td></tr>`)).join('');

  const hot = r.quality.hotspots.map(h => `<tr><td class="mono">${esc(h.column)}</td><td class="num">${h.null_pct}%</td></tr>`).join('');
  const expected = r.quality.expected_nulls.length;

  const readiness = (r.readiness || []).map(rd => `
      <div class="ent-row"><div class="eh"><span class="en">${esc(rd.intent)}</span>
        <span class="integ ${rd.ready === rd.total ? 'ready' : 'quality'}">${rd.ready}/${rd.total} ready</span></div>
        <div class="est-table-wrap"><table class="est-table" style="margin-top:6px;"><thead><tr><th>Data point</th><th>Report</th><th>Found in</th><th>State</th></tr></thead><tbody>
        ${rd.data_points.map(p => `<tr><td class="mono">${esc(p.data_point)}</td><td>${esc(p.report || '')}</td>
          <td class="mono">${p.found_in.length ? p.found_in.map(esc).join('<br>') : '—'}</td>
          <td><span class="integ ${esc(p.status)}">${esc(p.status)}</span></td></tr>`).join('')}
        </tbody></table></div></div>`).join('');

  const entities = (r.entities || []).map(e => `<div class="ent-row">
      <div class="eh"><span class="en">${esc(e.table)}</span><span class="kind">${esc(e.entity_type)}</span>
        <span class="empty-note" style="padding:0;">${fmtNum(e.rows)} rows</span></div>
      <div class="em">${esc(e.business_meaning || '')}</div>
      ${e.concerns ? `<div class="ec">${esc(e.concerns)}</div>` : ''}</div>`).join('');

  const allQ = (r.open_questions || []).map(x => `<div class="q-item">
      <div><span class="sev ${esc(x.severity)}">${esc(x.severity)}</span><span class="q-kind">${esc(x.kind)}</span></div>
