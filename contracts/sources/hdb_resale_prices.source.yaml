# ----------------------------------------------------------------------
# S004  hdb_resale_prices  (api)
# ----------------------------------------------------------------------
$schema: jarvis/source/v1
source_id: hdb_resale_prices
domain: property
owner: data-eng@example.com
classification: public
connection:
  type: api
  endpoint: https://api-production.data.gov.sg/v2/public/api/datasets/d_8b84c4ee58e3cfc0ece0d773c8ca6abc/list-rows
  auth: none
  pagination: cursor
arrival:
  cadence: monthly
  late_action: alert
load:
  strategy: append
  primary_key:
  - vault_id
  watermark: month
schema:
- name: vault_id
  type: string
  nullable: false
  description: Row id from the API
- name: month
  type: string
  nullable: false
  description: Registration month
  format: '%Y-%m'
- name: town
  type: string
  nullable: false
- name: flat_type
  type: string
  nullable: false
- name: block
  type: string
  nullable: true
- name: street_name
  type: string
  nullable: true
- name: storey_range
  type: string
  nullable: true
- name: floor_area_sqm
  type: decimal
  nullable: true
- name: flat_model
  type: string
  nullable: true
- name: lease_commence_date
  type: string
  nullable: true
- name: remaining_lease
  type: string
  nullable: true
  description: e.g. '61 years 04 months' -- not numeric, kept as text
- name: resale_price
  type: decimal
  nullable: false
file_checks:
  min_rows: 1
  expected_columns: 12
  reject_on_schema_drift: true
  quarantine_path: harness/quarantine/hdb_resale_prices/
quality_rules:
- rule: not_null
  columns:
  - vault_id
  - resale_price
  severity: error
- rule: unique
  columns:
  - vault_id
  severity: error
- rule: range
  columns:
  - resale_price
  severity: error
  params:
    min: 0
    max: 5000000
- rule: accepted_values
  columns:
  - flat_type
  severity: warn
  params:
    values:
    - 1 ROOM
    - 2 ROOM
    - 3 ROOM
    - 4 ROOM
    - 5 ROOM
    - EXECUTIVE
    - MULTI-GENERATION
sla:
  freshness_hours: 720
  completeness_pct: 95
