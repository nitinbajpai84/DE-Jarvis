$schema: jarvis/source/v1
source_id: orders
domain: sales
owner: data-eng@example.com
classification: internal

connection:
  type: file
  path: harness/landing/orders/orders_*.csv
  format: csv
  delimiter: ","
  header: true
  encoding: utf-8

arrival:
  cadence: daily
  expected_by: "06:00 Asia/Singapore"
  grace_minutes: 60
  late_action: alert

load:
  strategy: append
  primary_key: [order_id]
  watermark: order_ts

schema:
  - {name: order_id,     type: string,    nullable: false, description: "Natural key"}
  - {name: customer_id,  type: string,    nullable: false, description: "FK to customers"}
  - {name: order_date,   type: date,      nullable: false, format: "%d/%m/%Y"}
  - {name: order_ts,     type: timestamp, nullable: false}
  - {name: status,       type: string,    nullable: false}
  - {name: currency,     type: string,    nullable: false}
  - {name: gross_amount, type: decimal,   nullable: false}
  - {name: country,      type: string,    nullable: true}

file_checks:
  min_rows: 100
  expected_columns: 8
  row_count_deviation_pct: 30
  size_deviation_pct: 40
  reject_on_schema_drift: true
  quarantine_path: harness/quarantine/orders/

quality_rules:
  - {rule: not_null,        columns: [order_id, customer_id, order_ts], severity: error}
  - {rule: unique,          columns: [order_id],                        severity: error}
  - {rule: accepted_values, columns: [status],   params: {values: [NEW, PAID, SHIPPED, CANCELLED]}, severity: error}
  - {rule: accepted_values, columns: [currency], params: {values: [SGD, USD, EUR, INR]},            severity: warn}
  - {rule: range,           columns: [gross_amount], params: {min: 0, max: 1000000},                severity: error}
  - {rule: freshness,       columns: [order_ts], params: {max_age_hours: 30},                       severity: warn}

sla:
  freshness_hours: 24
  completeness_pct: 99.5
