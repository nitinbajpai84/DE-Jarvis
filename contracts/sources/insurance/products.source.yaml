# ----------------------------------------------------------------------
# S005  products  (file)
# ----------------------------------------------------------------------
$schema: jarvis/source/v1
source_id: products
domain: insurance
client: default
owner: data-eng@example.com
classification: internal
connection:
  type: file
  path: harness/landing/products/products_*.csv
  format: csv
  delimiter: ','
  header: true
  encoding: utf-8
arrival:
  cadence: daily
  expected_by: 06:00 Asia/Singapore
load:
  strategy: append
  primary_key:
  - product_id
schema:
- name: product_id
  type: string
  nullable: false
  description: Natural key
- name: product_code
  type: string
  nullable: false
- name: product_name
  type: string
  nullable: false
- name: line_of_business
  type: string
  nullable: false
  description: auto|home|life|health|commercial
- name: product_family
  type: string
  nullable: false
- name: product_component_type
  type: string
  nullable: false
  description: base|rider
- name: active_flag
  type: bool
  nullable: false
file_checks:
  min_rows: 10
  expected_columns: 7
  row_count_deviation_pct: 40
  reject_on_schema_drift: true
  quarantine_path: harness/quarantine/products/
quality_rules:
- rule: not_null
  columns:
  - product_id
  - product_code
  severity: error
- rule: unique
  columns:
  - product_id
  severity: error
sla:
  freshness_hours: 24
  completeness_pct: 99
