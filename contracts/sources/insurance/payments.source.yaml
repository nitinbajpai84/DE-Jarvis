# ----------------------------------------------------------------------
# S009  payments  (file)
# ----------------------------------------------------------------------
$schema: jarvis/source/v1
source_id: payments
domain: insurance
client: default
owner: data-eng@example.com
classification: internal
connection:
  type: file
  path: harness/landing/payments/payments_*.csv
  format: csv
  delimiter: ','
  header: true
  encoding: utf-8
arrival:
  cadence: daily
  expected_by: 06:00 Asia/Singapore
load:
  strategy: append
  primary_key:
  - payment_id
schema:
- name: payment_id
  type: string
  nullable: false
  description: Natural key
- name: policy_id
  type: string
  nullable: false
  description: FK to policies
- name: customer_id
  type: string
  nullable: false
  description: FK to customers
  pii: true
- name: payment_date
  type: date
  nullable: false
  format: '%Y-%m-%d'
- name: payment_status
  type: string
  nullable: false
  description: scheduled|paid|failed|reversed|refunded|past_due
- name: payment_method
  type: string
  nullable: true
  description: card|ach|check|cash|wire|payroll|other
- name: billed_amount
  type: decimal
  nullable: false
- name: paid_amount
  type: decimal
  nullable: false
file_checks:
  min_rows: 100
  expected_columns: 8
  row_count_deviation_pct: 40
  reject_on_schema_drift: true
  quarantine_path: harness/quarantine/payments/
quality_rules:
- rule: not_null
  columns:
  - payment_id
  - policy_id
  - customer_id
  severity: error
- rule: unique
  columns:
  - payment_id
  severity: error
- rule: accepted_values
  columns:
  - payment_status
  severity: warn
  params:
    values:
    - scheduled
    - paid
    - failed
    - reversed
    - refunded
    - past_due
sla:
  freshness_hours: 24
  completeness_pct: 99
